[package]
name = "omnifusion-desktop"
version = "0.1.4"
description = "OmniFusion desktop companion: manage the local gateway process and embed the dashboard"
edition = "2021"

[lib]
name = "omnifusion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
