<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OmniFusion Desktop</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #3fb950; --accent2: #58a6ff; --danger: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; font-weight: 600; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }
  .badge.on { color: var(--accent); border-color: var(--accent); }
  .badge.off { color: var(--muted); }
  .badge.mgd { color: var(--accent2); border-color: var(--accent2); }
  .grow { flex: 1; }
  button { background: #21262d; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: #8b949e; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #1f6feb33; border-color: #316dca; }
  button.danger { background: #da363433; border-color: #b62324; }
  select { background: #0d1117; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  section.settings { padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .grid { display: grid; grid-template-columns: 2fr 2fr 1.4fr auto; gap: 8px; align-items: end; }
  .grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input { background: #0d1117; border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 100%; }
  .row2 { display: grid; grid-template-columns: 2fr 1.4fr auto auto; gap: 8px; align-items: end; margin-top: 8px; }
  .msg { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; white-space: pre-wrap; word-break: break-all; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  nav.tabs { display: flex; gap: 4px; padding: 8px 18px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
  nav.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; background: transparent; color: var(--muted); padding: 7px 14px; }
  nav.tabs button.active { color: var(--fg); border-bottom-color: var(--accent2); }
  #frameWrap { position: relative; flex: 1; display: flex; background: var(--bg); }
  #gwDown { position: absolute; inset: 0; display: none; place-items: center;
    background: var(--bg); color: var(--muted); font-size: 15px; text-align: center; line-height: 2; }
</style>
</head>
<body>
<header>
  <h1>OmniFusion Desktop</h1>
  <span class="badge off" id="statusBadge"></span>
  <div class="grow"></div>
  <select id="selLang" title="Language">
    <option value="auto">跟随系统 / Auto</option>
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <button id="btnRefresh"></button>
  <button id="btnStart" class="primary"></button>
  <button id="btnStop" class="danger"></button>
</header>

<section class="settings">
  <div class="grid">
    <label><span id="lblBin"></span>
      <input id="inBin" />
    </label>
    <label><span id="lblConfig"></span>
      <input id="inConfig" />
    </label>
    <label><span id="lblBase"></span>
      <input id="inBase" value="http://127.0.0.1:20130" />
    </label>
    <button id="btnSave"></button>
  </div>
  <div class="row2">
    <label><span id="lblKey"></span>
      <input id="inKey" />
    </label>
    <button id="btnKey" class="primary"></button>
  </div>
  <div class="row2">
    <label><span id="lblProvider"></span>
      <select id="selProvider">
        <option value="openrouter">OpenRouter（免费模型聚合）</option>
        <option value="groq">Groq</option>
        <option value="cerebras">Cerebras</option>
        <option value="gemini">Google Gemini</option>
        <option value="nvidia">NVIDIA NIM</option>
        <option value="cloudflare">Cloudflare Workers AI</option>
        <option value="huggingface">HuggingFace</option>
        <option value="zhipu">智谱 BigModel（GLM-Flash 免费）</option>
        <option value="siliconflow">硅基流动 SiliconFlow（L0 免费档）</option>
        <option value="modelscope">魔搭 ModelScope（每日 2000 次）</option>
        <option value="qwen">通义千问（新人每模型 100 万 tokens）</option>
        <option value="sambanova">SambaNova（每日 20M tokens 免费）</option>
        <option value="mistral">Mistral（Experiment 免费档，需代理）</option>
        <option value="cohere">Cohere（Trial：1000 次/月）</option>
        <option value="chutes">Chutes（免费档限速）</option>
        <option value="qianfan">百度千帆（ERNIE-Speed/Lite 免费）</option>
        <option value="spark">讯飞星火（Lite 永久免费）</option>
        <option value="hunyuan">腾讯混元（100 万 tokens/年）</option>
        <option value="deepseek">DeepSeek（BYOK 付费）</option>
        <option value="mimo">小米 MiMo（BYOK 付费）</option>
        <option value="ark">火山方舟·豆包（BYOK 付费）</option>
        <option value="together">Together AI（BYOK 付费）</option>
        <option value="anthropic">Anthropic（BYOK）</option>
        <option value="ollama">Ollama（本地，免密钥）</option>
      </select>
    </label>
    <button id="btnKeyAdd"></button>
    <button id="btnSignup" title=""></button>
    <span class="msg" id="keyAddHint" style="align-self:center"></span>
  </div>
  <div class="row2">
    <label><span id="lblClient"></span>
      <select id="selClient">
        <option value="claude">Claude Code</option>
        <option value="codex">Codex CLI</option>
        <option value="gemini">Gemini CLI</option>
        <option value="opencode">OpenCode</option>
      </select>
    </label>
    <button id="btnConnect"></button>
    <span class="msg" id="connectHint" style="align-self:center"></span>
  </div>
  <div class="msg" id="msg"></div>
</section>

<nav class="tabs" id="tabs"></nav>
<!-- dashboard 承载区：不再是 iframe——由 Rust 侧的子 webview（dash）精确
     覆盖本区域（跨源 iframe 在 WebView2 下不接收键盘输入的根治方案）；
     gwDown 遮罩在子 webview 隐藏时露出。 -->
<div id="frameWrap">
  <div id="gwDown"></div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const PAGES = ["chat", "providers", "keys", "usage", "compression", "resilience"];
const I18N = {
  zh: {
    refresh: "刷新状态", start: "启动网关", stop: "停止网关", save: "保存设置",
    readKey: "从 ofd 读取 Key", detecting: "检测中…",
    lblBin: "ofd 可执行文件路径", phBin: "C:\\path\\to\\ofd.exe（留空则按 PATH 解析 ofd.exe）",
    lblConfig: "配置文件（可选）", phConfig: "C:\\path\\to\\config.yaml（留空用内置默认值）",
    lblBase: "网关地址",
    lblKey: "网关 API Key（本机明文存储于应用配置目录）",
    phKey: "ofg-…（点击右侧按钮从 ofd 读取）",
    lblProvider: "提供商密钥管理", btnKeyAdd: "添加/更新密钥…", btnSignup: "申请密钥 ↗",
    signupHint: "在浏览器打开该厂商的官方申请页", msgSignupFail: "打开申请页失败: ",
    keyAddHint: "在弹出的控制台窗口中粘贴密钥（输入隐藏），完成后窗口自动可关",
    msgKeyAddOk: "已打开密钥录入控制台（完成后刷新状态）", msgKeyAddFail: "拉起录入失败: ",
    lblClient: "接入 CLI 客户端", btnConnect: "一键接入…",
    connectHint: "弹出控制台自动写入该 CLI 的配置（原文件自动备份），完成后重启对应 CLI 生效",
    msgConnectOk: "已打开接入控制台（写入详情见控制台）", msgConnectFail: "拉起接入失败: ",
    tabs: { chat: "对话", providers: "提供商", keys: "密钥", usage: "用量", compression: "压缩", resilience: "弹性" },
    gwDown: "网关未运行<br>点击右上「启动网关」即可开始（安装包自带网关，无需另外下载）",
    detail: { managed: "运行中（本应用托管）", external: "运行中（外部启动，本应用仅观测）", stopped: "未运行" },
    err: {
      spawn_failed: "启动进程失败",
      early_exit: "网关进程立即退出（附日志尾部）：请检查二进制路径与配置文件",
      health_timeout: "网关已拉起但 20s 内未就绪（重启后首次运行过杀毒扫描可能较慢；进程仍在运行，稍候点「刷新状态」查看）。日志尾部：",
      not_managed: "当前实例非本应用托管（外部启动），请自行停止",
      gateway_key_failed: "ofd gateway-key 退出码非 0", gateway_key_empty: "ofd gateway-key 输出为空",
    },
    msgSaved: "设置已保存", msgSaveFail: "保存失败: ", msgKeyOk: "已读取网关 key", msgKeyFail: "读取失败: ",
    msgStarting: "启动中…", msgStarted: "网关已启动", msgStopped: "已停止", msgAlready: "网关已在运行",
    msgStartFail: "启动失败: ", msgStopFail: "停止失败: ", msgProbeFail: "探测失败: ",
    healthOk: " · /healthz OK",
  },
  en: {
    refresh: "Refresh Status", start: "Start Gateway", stop: "Stop Gateway", save: "Save Settings",
    readKey: "Read Key from ofd", detecting: "Checking…",
    lblBin: "ofd executable path", phBin: "C:\\path\\to\\ofd.exe (empty = resolve ofd.exe from PATH)",
    lblConfig: "Config file (optional)", phConfig: "C:\\path\\to\\config.yaml (empty = built-in defaults)",
    lblBase: "Gateway base URL",
    lblKey: "Gateway API Key (stored in plaintext in the app config dir)",
    phKey: "ofg-… (click the button on the right to read from ofd)",
    lblProvider: "Provider key management", btnKeyAdd: "Add / update key…", btnSignup: "Get key ↗",
    signupHint: "Opens the provider's official key page in your browser", msgSignupFail: "Failed to open: ",
    keyAddHint: "Paste the key in the console window that opens (input hidden)",
    msgKeyAddOk: "Key-entry console opened (refresh status when done)", msgKeyAddFail: "Failed to launch: ",
    lblClient: "Connect a CLI client", btnConnect: "One-click connect…",
    connectHint: "Opens a console that writes the CLI's config (original backed up); restart that CLI afterwards",
    msgConnectOk: "Connect console opened (details in the console)", msgConnectFail: "Failed to launch: ",
    tabs: { chat: "Chat", providers: "Providers", keys: "Keys", usage: "Usage", compression: "Compression", resilience: "Resilience" },
    gwDown: "Gateway not running<br>Click \"Start Gateway\" at the top right to begin (the gateway is bundled — nothing else to install)",
    detail: { managed: "Running (managed by this app)", external: "Running (started externally, observed only)", stopped: "Stopped" },
    err: {
      spawn_failed: "Failed to spawn process",
      early_exit: "Gateway exited immediately (log tail attached): check the binary path and config file",
      health_timeout: "Gateway started but not ready within 20s (first run after a reboot may be slowed by antivirus scanning; the process is still running — click \"Refresh Status\" in a moment). Log tail: ",
      not_managed: "Current instance is not managed by this app (started externally); stop it yourself",
      gateway_key_failed: "ofd gateway-key exited non-zero", gateway_key_empty: "ofd gateway-key output is empty",
    },
    msgSaved: "Settings saved", msgSaveFail: "Save failed: ", msgKeyOk: "Gateway key read", msgKeyFail: "Read failed: ",
    msgStarting: "Starting…", msgStarted: "Gateway started", msgStopped: "Stopped", msgAlready: "Gateway already running",
    msgStartFail: "Start failed: ", msgStopFail: "Stop failed: ", msgProbeFail: "Probe failed: ",
    healthOk: " · /healthz OK",
  },
};
const $ = (id) => document.getElementById(id);
let settings = { bin: "", config: "", base: "http://127.0.0.1:20130", key: "", lang: "auto" };
let activePage = "providers";
let t = I18N.en;

function effLang() {
  if (settings.lang === "zh" || settings.lang === "en") return settings.lang;
  return (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
}

function setMsg(text, cls) {
  const el = $("msg");
  el.textContent = text || "";
  el.className = "msg" + (cls ? " " + cls : "");
}

// 后端错误形如 "code: raw detail"，code 映射本地文案，detail 原样保留。
function locErr(e) {
  const s = String(e);
  const i = s.indexOf(":");
  const code = i > 0 ? s.slice(0, i) : s;
  const rest = i > 0 ? s.slice(i) : "";
  return t.err[code] ? t.err[code] + rest : s;
}

function currentInputs() {
  return {
    bin: $("inBin").value.trim(),
    config: $("inConfig").value.trim(),
    base: $("inBase").value.trim() || "http://127.0.0.1:20130",
    key: $("inKey").value.trim(),
    lang: settings.lang || "auto",
  };
}

function applySettings(s) {
  settings = { bin: "", config: "", base: "http://127.0.0.1:20130", key: "", lang: "auto", ...(s || {}) };
  if (settings.lang !== "zh" && settings.lang !== "en") settings.lang = "auto";
  $("inBin").value = settings.bin;
  $("inConfig").value = settings.config;
  $("inBase").value = settings.base;
  $("inKey").value = settings.key;
}

function applyLang() {
  t = I18N[effLang()];
  document.documentElement.lang = effLang() === "zh" ? "zh-CN" : "en";
  $("selLang").value = settings.lang || "auto";
  $("btnRefresh").textContent = t.refresh;
  $("btnStart").textContent = t.start;
  $("btnStop").textContent = t.stop;
  $("btnSave").textContent = t.save;
  $("btnKey").textContent = t.readKey;
  $("lblBin").textContent = t.lblBin;
  $("lblConfig").textContent = t.lblConfig;
  $("lblBase").textContent = t.lblBase;
  $("lblKey").textContent = t.lblKey;
  $("lblProvider").textContent = t.lblProvider;
  $("btnKeyAdd").textContent = t.btnKeyAdd;
  $("btnSignup").textContent = t.btnSignup;
  $("btnSignup").title = t.signupHint;
  $("keyAddHint").textContent = t.keyAddHint;
  $("lblClient").textContent = t.lblClient;
  $("btnConnect").textContent = t.btnConnect;
  $("connectHint").textContent = t.connectHint;
  $("inBin").placeholder = t.phBin;
  $("inConfig").placeholder = t.phConfig;
  $("inKey").placeholder = t.phKey;
  $("statusBadge").textContent = t.detecting;
  renderTabs();
}

// --- dashboard 子 webview 驱动层（替代 iframe：WebView2 跨源 iframe
// 不接收键盘输入的根治方案）。壳只做三件事：布局上报（frameWrap 矩形
// → Rust set_position/size）、按需导航（URL 变化才 navigate，杜绝
// 周期刷新重载）、随网关状态显隐。 ---
let dashReady = false;        // 子 webview 已创建
let lastFrameUrl = "";        // 当前应当显示的 URL
let dashCurrentUrl = "";      // 子 webview 实际所在的 URL
let dashWasRunning = false;   // 网关上次状态（停→起需强制重导航）

async function layoutDash() {
  const r = $("frameWrap").getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  const args = { x: r.left, y: r.top, w: r.width, h: r.height };
  try {
    if (!dashReady) {
      await invoke("dash_create", { url: lastFrameUrl || "http://127.0.0.1:20130/", ...args });
      dashReady = true;
      await syncDashVisibility(true);
    } else {
      await invoke("dash_layout", args);
    }
  } catch { /* 布局失败下一帧重试（ResizeObserver 持续触发） */ }
}

function navigateDashIfNeeded() {
  if (!dashReady || !lastFrameUrl || lastFrameUrl === dashCurrentUrl) return;
  dashCurrentUrl = lastFrameUrl;
  invoke("dash_navigate", { url: lastFrameUrl }).catch(() => { dashCurrentUrl = ""; });
}

async function syncDashVisibility(running) {
  try { await invoke("dash_visible", { visible: running }); } catch { /* 尽力而为 */ }
}

function loadFrame() {
  const base = $("inBase").value.trim() || "http://127.0.0.1:20130";
  const key = encodeURIComponent($("inKey").value.trim());
  // 子 webview 模式：壳强制传 lang（壳语言是唯一真源）+ embed=1
  //（隐藏页内导航与语言切换——桌面标签已提供导航，避免双控制源打架）。
  const lang = `&lang=${effLang()}&embed=1`;
  lastFrameUrl = `${base}/dashboard/${activePage}?key=${key}${lang}`;
  navigateDashIfNeeded();
}

function renderTabs() {
  const nav = $("tabs");
  nav.innerHTML = "";
  for (const id of PAGES) {
    const b = document.createElement("button");
    b.textContent = t.tabs[id];
    b.className = id === activePage ? "active" : "";
    b.onclick = () => { activePage = id; renderTabs(); loadFrame(); };
    nav.appendChild(b);
  }
}

async function refresh() {
  const { base } = currentInputs();
  try {
    const s = await invoke("gateway_status", { base });
    const badge = $("statusBadge");
    badge.textContent = (t.detail[s.detail] || s.detail) + (s.running ? t.healthOk : "");
    badge.className = "badge " + (s.running ? (s.managed ? "mgd" : "on") : "off");
    $("btnStop").disabled = !s.managed;
    $("btnStart").disabled = s.running;
    $("gwDown").style.display = s.running ? "none" : "grid";
    $("gwDown").innerHTML = t.gwDown;
    await syncDashVisibility(s.running);
    if (s.running) {
      // 停→起过渡：子 webview 里可能还停着网关停机时的错误页（URL 未变
      // 不会触发重导航），强制重载一次。
      if (!dashWasRunning) dashCurrentUrl = "";
      navigateDashIfNeeded(); // URL 有变才导航（幂等，无重载）
    }
    dashWasRunning = s.running;
  } catch (e) {
    $("statusBadge").textContent = t.msgProbeFail + e;
    $("statusBadge").className = "badge off";
  }
}

$("btnRefresh").onclick = refresh;
$("btnSave").onclick = async () => {
  try {
    await invoke("save_settings", { settings: currentInputs() });
    setMsg(t.msgSaved, "ok");
  } catch (e) { setMsg(t.msgSaveFail + e, "err"); }
};
$("btnKey").onclick = async () => {
  const { bin } = currentInputs();
  try {
    // bin 留空原样传空：后端 resolve_bin 先找安装目录捆绑副本再回落
    // PATH——前端预填 "ofd.exe" 会让该解析永远走不到（v0.1.2 实测缺陷）。
    const key = await invoke("fetch_gateway_key", { bin });
    $("inKey").value = key;
    setMsg(t.msgKeyOk, "ok");
    loadFrame();
  } catch (e) { setMsg(t.msgKeyFail + locErr(e), "err"); }
};
$("btnKeyAdd").onclick = async () => {
  const { bin, config } = currentInputs();
  const provider = $("selProvider").value;
  try {
    await invoke("key_add", { bin, config, provider });
    setMsg(t.msgKeyAddOk, "ok");
  } catch (e) { setMsg(t.msgKeyAddFail + locErr(e), "err"); }
};
// 一键申请密钥：从网关 keys API 取该厂商的官方申请页并打开浏览器。
let signupMap = {};
async function loadSignupMap() {
  try {
    const base = $("inBase").value.trim() || "http://127.0.0.1:20130";
    const k = encodeURIComponent($("inKey").value.trim());
    const resp = await fetch(`${base}/dashboard/api/keys${k ? "?key=" + k : ""}`);
    if (!resp.ok) return;
    const body = await resp.json();
    signupMap = {};
    (body.keys || []).forEach(r => { if (r.signup_url) signupMap[r.provider] = r.signup_url; });
  } catch { /* 网关未起时静默 */ }
}
$("btnSignup").onclick = async () => {
  const provider = $("selProvider").value;
  if (!signupMap[provider]) await loadSignupMap();
  const url = signupMap[provider];
  if (!url) { setMsg(t.msgSignupFail + provider, "err"); return; }
  try { await invoke("open_signup", { url }); } catch (e) { setMsg(t.msgSignupFail + locErr(e), "err"); }
};
$("btnConnect").onclick = async () => {
  const { bin, config } = currentInputs();
  const cli = $("selClient").value;
  try {
    await invoke("client_connect", { bin, config, cli });
    setMsg(t.msgConnectOk, "ok");
  } catch (e) { setMsg(t.msgConnectFail + locErr(e), "err"); }
};
$("btnStart").onclick = async () => {
  const { bin, config, base } = currentInputs();
  $("btnStart").disabled = true;
  setMsg(t.msgStarting);
  try {
    const r = await invoke("gateway_start", { bin, config, base });
    if (r === "already-running") setMsg(t.msgAlready, "ok");
    else if (r.startsWith("started")) setMsg(t.msgStarted + r.slice("started".length), "ok");
    else setMsg(r, "ok");
  } catch (e) { setMsg(t.msgStartFail + locErr(e), "err"); }
  refresh();
};
$("btnStop").onclick = async () => {
  try {
    const r = await invoke("gateway_stop");
    setMsg(r.startsWith("stopped") ? t.msgStopped + r.slice("stopped".length) : r, "ok");
  } catch (e) { setMsg(t.msgStopFail + locErr(e), "err"); }
  refresh();
};
$("selLang").onchange = async () => {
  settings.lang = $("selLang").value;
  applyLang();
  try {
    await invoke("set_language", { lang: effLang() });
    await invoke("save_settings", { settings: currentInputs() });
  } catch { /* 托盘同步/持久化失败不阻塞界面语言切换 */ }
  loadFrame();
  refresh();
};
["inBase", "inKey"].forEach((id) => $(id).addEventListener("change", loadFrame));

(async function init() {
  try { applySettings(await invoke("load_settings")); } catch { /* 首次运行为空 */ }
  applyLang();
  // 自动读取网关 key（best-effort）：装完即用的一部分——桌面端知道
  // 捆绑 ofd 的位置，无需用户手点「从 ofd 读取 Key」；读不到静默跳过
  //（尚未录入任何 key 的全新安装会走首启引导）。
  if (!$("inKey").value.trim()) {
    try {
      const { bin } = currentInputs();
      const k = await invoke("fetch_gateway_key", { bin });
      $("inKey").value = k;
      try { await invoke("save_settings", { settings: currentInputs() }); } catch { /* 持久化尽力而为 */ }
    } catch { /* 静默 */ }
  }
  loadFrame();
  layoutDash();
  new ResizeObserver(() => layoutDash()).observe($("frameWrap"));
  window.addEventListener("resize", () => layoutDash());
  try { await invoke("set_language", { lang: effLang() }); } catch { /* 托盘语言同步尽力而为 */ }
  await refresh();
  setInterval(refresh, 3000);
})();
</script>
<script src="assets/gsap.min.js"></script>
<script>
// 桌面壳微动效（与 dashboard 同库同纪律）：徽标呼吸 + 标签按下回弹。
(function () {
  'use strict';
  if (typeof gsap === 'undefined' || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  gsap.defaults({ duration: 0.35, ease: 'power2.out' });
  gsap.from(['header', 'section.settings', 'nav.tabs'], { autoAlpha: 0, y: 8, stagger: 0.06, duration: 0.3, clearProps: 'all' });
  const badge = document.getElementById('statusBadge');
  if (badge) {
    const pulse = () => { if (badge.className.indexOf('off') < 0) gsap.to(badge, { scale: 1.08, duration: 0.9, ease: 'sine.inOut', repeat: -1, yoyo: true }); };
    pulse();
  }
  document.querySelectorAll('nav.tabs button, section button').forEach(b => {
    b.addEventListener('pointerdown', () => gsap.fromTo(b, { scale: 0.96 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' }));
  });
})();
</script>
