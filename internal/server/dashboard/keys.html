<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">OmniFusion · Keys</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; }
  nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  nav a[aria-current] { color: #e6edf3; text-decoration: underline; }
  .meta { color: #8b949e; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; white-space: nowrap; }
  .src-env { color: #d29922; }
  .src-stored { color: #3fb950; }
  .src-none { color: #f85149; }
  .empty { color: #8b949e; padding: 24px 0; }
  #err { color: #f85149; white-space: pre-wrap; }
  .st-ok { color: #3fb950; white-space: nowrap; }
  .st-todo { color: #8b949e; white-space: nowrap; }
  .summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  .sum-pill { background: #161b22; border: 1px solid #30363d; border-radius: 999px; padding: 4px 14px; font-size: 13px; }
  .sum-ok { color: #3fb950; }
  .sum-todo { color: #d29922; }
  .filters { display: inline-flex; gap: 6px; }
  .filters button { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 14px; font: inherit; cursor: pointer; }
  .filters button.active { border-color: #58a6ff; color: #58a6ff; }
  /* 行内密钥操作（免进设置逐个选） */
  .kact { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kact .kin { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; width: 210px; font-size: 12px; }
  .kact .kin:focus { border-color: #58a6ff; outline: none; }
  .kact .act { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .kact .act.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .kact .act:disabled { opacity: .55; cursor: wait; }
  .kact .kmsg { color: #3fb950; font-size: 11px; }
  .kact a { color: #58a6ff; text-decoration: none; white-space: nowrap; }
</style>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion.js"></script>
</head></head>
<body>
<header>
  <h1 data-i18n="page_title">OmniFusion · Keys</h1>
  <nav id="nav"></nav>
</header>
<p class="meta" id="meta"></p>
<div class="summary">
  <span class="sum-pill" id="sum-ok"></span>
  <span class="sum-pill" id="sum-todo"></span>
  <span class="filters">
    <button id="f-all" type="button"></button>
    <button id="f-todo" type="button"></button>
  </span>
</div>
<div id="err"></div>
<table>
  <thead><tr>
    <th data-i18n="th_provider">provider</th><th data-i18n="th_source">source</th><th data-i18n="th_updated">updated</th><th data-i18n="th_status">status</th><th data-i18n="th_action">action</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
'use strict';
// --- i18n (pattern shared across dashboard pages) ---
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('ofd-lang');
  const nav = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const lang = (q === 'zh' || q === 'en') ? q : ((saved === 'zh' || saved === 'en') ? saved : nav);
  try { localStorage.setItem('ofd-lang', lang); } catch (e) {}
  return lang;
})();
const I18N = {
  en: {
    page_title: 'OmniFusion · Keys',
    nav_providers: 'Providers', nav_keys: 'Keys', nav_usage: 'Usage',
    nav_compression: 'Compression', nav_resilience: 'Resilience', nav_chat: 'Chat',
    th_provider: 'Providers', th_source: 'source', th_updated: 'updated', th_status: 'status', th_action: 'action',
    apply: 'apply ↗',
    status_ok: '✓ configured', status_todo: '— no key yet',
    act_add: 'Add key', act_update: 'Update', act_saving: 'Saving…',
    act_stored: '✓ stored — restart the gateway to activate',
    act_apply_first: 'Get a key from the official page first ↗',
    act_placeholder: 'Paste API key…',
    sum_ok: '{n} configured', sum_todo: '{n} to apply',
    f_all: 'All', f_todo: 'To apply',
    empty: 'no keys — add one inline below or export *_API_KEY',
    meta: '{n} keys · refreshed {time}',
  },
  zh: {
    page_title: 'OmniFusion · 密钥',
    nav_providers: '提供商', nav_keys: '密钥', nav_usage: '用量',
    nav_compression: '压缩', nav_resilience: '弹性', nav_chat: '对话',
    th_provider: '提供商', th_source: '密钥来源', th_updated: '更新于', th_status: '状态', th_action: '操作',
    apply: '去申请 ↗',
    status_ok: '✓ 已添加', status_todo: '— 待申请/添加',
    act_add: '添加密钥', act_update: '更新', act_saving: '保存中…',
    act_stored: '✓ 已添加 — 重启网关后生效',
    act_apply_first: '先去官方页申请密钥 ↗',
    act_placeholder: '粘贴 API 密钥…',
    sum_ok: '已添加 {n} 家', sum_todo: '待申请 {n} 家',
    f_all: '全部', f_todo: '待申请',
    empty: '未配置任何密钥 — 可在下方行内添加，或导出 *_API_KEY',
    meta: '{n} 个密钥 · 刷新于 {time}',
  },
};
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

const key = new URLSearchParams(location.search).get('key') || '';
const PAGES = [['providers','nav_providers'],['keys','nav_keys'],['usage','nav_usage'],
               ['compression','nav_compression'],['resilience','nav_resilience'],['chat','nav_chat']];
const pageHref = (id, lang) => id + '.html?' + (key ? 'key=' + encodeURIComponent(key) + '&' : '') + 'lang=' + lang;
const EMBED = new URLSearchParams(location.search).has('embed');
try { document.cookie = 'ofdPageLoaded=' + Date.now() + '; path=/; SameSite=Lax'; } catch (e) {} // 桌面端内嵌：壳是唯一语言/导航控制源
if (!EMBED) document.getElementById('nav').innerHTML = PAGES.map(([id, nk]) => {
  const cur = id === 'keys' ? ' aria-current="page"' : '';
  return `<a href="${pageHref(id, LANG)}"${cur}>${t(nk)}</a>`;
}).join('') +
  ` <a href="${pageHref('keys', 'zh')}">中文</a> <a href="${pageHref('keys', 'en')}">EN</a>`;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function srcClass(s) { return s.startsWith('env:') ? 'src-env' : s === 'stored' ? 'src-stored' : s === 'none' ? 'src-none' : ''; }
function vname(id) { if (!(window.OFD && window.OFD.motion)) return esc(id); return esc(OFD.motion.vendorName(id, LANG)) + ' <span class="meta">(' + esc(id) + ')</span>'; }

let filterTodo = false; // 待申请筛选（5s 轮询重渲染时保持）

function setFilter(todo) {
  filterTodo = todo;
  document.getElementById('f-all').className = todo ? '' : 'active';
  document.getElementById('f-todo').className = todo ? 'active' : '';
  load();
}
document.getElementById('f-all').onclick = () => setFilter(false);
document.getElementById('f-todo').onclick = () => setFilter(true);
document.getElementById('f-all').textContent = t('f_all');
document.getElementById('f-todo').textContent = t('f_todo');

// keyConfigured 判定一行是否已有密钥（stored=网关库；env:=环境变量；
// ollama 无需 key，算"开箱即用"而非待办）。
function keyConfigured(k) { return k.source === 'stored' || k.source.startsWith('env:') || k.provider === 'ollama'; }

async function load() {
  const err = document.getElementById('err');
  try {
    const resp = await fetch('api/keys' + (key ? '?key=' + encodeURIComponent(key) : ''));
    const body = await resp.json();
    err.textContent = resp.ok ? '' : (body.error && body.error.message) || `HTTP ${resp.status}`;
    if (!resp.ok) return;
    const rows = document.getElementById('rows');
    const all = body.keys || [];
    const configured = all.filter(keyConfigured);
    const todo = all.filter(k => !keyConfigured(k));
    // 顶部汇总（不随筛选变化——永远是全局进度）。
    document.getElementById('sum-ok').innerHTML =
      `<span class="sum-ok">${t('sum_ok').replace('{n}', configured.length)}</span>`;
    document.getElementById('sum-todo').innerHTML =
      `<span class="sum-todo">${t('sum_todo').replace('{n}', todo.length)}</span>`;
    const shown = filterTodo ? todo : all;
    if (!shown.length) {
      rows.innerHTML = `<tr><td colspan="5" class="empty">${filterTodo ? t('f_todo') + ' ✓' : t('empty')}</td></tr>`;
    } else {
      rows.innerHTML = shown.map(k => {
        const cls = srcClass(k.source);
        const done = keyConfigured(k);
        const status = done
          ? `<span class="st-ok">${t('status_ok')}</span>`
          : `<span class="st-todo">${t('status_todo')}</span>`;
        // 行内操作（用户需求：免进设置逐个选）——待申请行=「去申请↗ +
        // 粘贴框 + 添加」；已添加行=「更新」按钮（同框，回车提交）。
        const apply = !done && k.signup_url
          ? `<a href="${esc(k.signup_url)}" target="_blank" rel="noopener noreferrer">${t('apply')}</a> ` : '';
        const upd = done
          ? `<button type="button" class="act" data-act="upd" data-p="${esc(k.provider)}">${t('act_update')}</button> `
          : '';
        const action = `<span class="kact">${apply}${upd}` +
          `<input type="password" class="kin" data-p="${esc(k.provider)}" placeholder="${t('act_placeholder')}" autocomplete="off">` +
          `<button type="button" class="act primary" data-act="save" data-p="${esc(k.provider)}">${done ? t('act_update') : t('act_add')}</button>` +
          `<span class="kmsg" data-m="${esc(k.provider)}"></span></span>`;
        return `<tr><td>${vname(k.provider)}</td><td${cls ? ` class="${cls}"` : ''}>${esc(k.source)}</td>` +
          `<td>${k.updated_at ? new Date(k.updated_at.replace(' ', 'T') + 'Z').toLocaleString() : '–'}</td>` +
          `<td>${status}</td><td>${action}</td></tr>`;
      }).join('');
    }
    if (window.OFD) OFD.motion.rows(document.getElementById('rows'));
    document.getElementById('meta').textContent =
      t('meta').replace('{n}', all.length).replace('{time}', new Date().toLocaleTimeString());
  } catch (e) {
    err.textContent = String(e);
  }
}
load();
setInterval(load, 5000);

// 行内密钥保存（事件委托——5s 轮询整表重渲染，挂 tbody 才不丢）。
// 仅 master 网关 key 可写（服务端精确比对；scoped token 403）。
document.getElementById('rows').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button.act');
  if (!btn || btn.dataset.act !== 'save') return;
  const p = btn.dataset.p;
  const input = rows.querySelector('input.kin[data-p="' + CSS.escape(p) + '"]');
  const msg = rows.querySelector('.kmsg[data-m="' + CSS.escape(p) + '"]');
  if (!input || !input.value.trim()) { if (msg) msg.textContent = ''; input && input.focus(); return; }
  btn.disabled = true; btn.textContent = t('act_saving');
  try {
    const resp = await fetch('api/keys/set' + (key ? '?key=' + encodeURIComponent(key) : ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: p, key: input.value.trim() }),
    });
    const body = await resp.json().catch(() => ({}));
    if (resp.ok && body.ok) {
      input.value = '';
      if (msg) msg.textContent = t('act_stored');
      load(); // 状态列立即翻转为已添加
    } else {
      if (msg) msg.textContent = (body.error && body.error.message) || ('HTTP ' + resp.status);
    }
  } catch (e) {
    if (msg) msg.textContent = String(e);
  } finally {
    btn.disabled = false; btn.textContent = t('act_add');
  }
});
// 回车=提交（同委托）。
document.getElementById('rows').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  const input = ev.target.closest('input.kin');
  if (!input) return;
  const btn = input.closest('.kact').querySelector('button[data-act="save"]');
  if (btn) btn.click();
});
</script>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion.js"></script>
</body>
</html>
