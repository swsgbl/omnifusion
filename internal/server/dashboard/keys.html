<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">OmniFusion · Keys</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; }
  nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  nav a[aria-current] { color: #e6edf3; text-decoration: underline; }
  .meta { color: #8b949e; font-size: 12px; }
  /* 表头吸顶：长表滚动时列含义不丢（separate 让表头的边框跟着吸顶走）。 */
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  thead th { position: sticky; inset-block-start: 0; z-index: 1; background: #0d1117; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; white-space: nowrap; }
  .src-env { color: #d29922; }
  .src-stored { color: #3fb950; }
  .src-none { color: #f85149; }
  .empty { color: #8b949e; padding: 24px 0; }
  #err { color: #f85149; white-space: pre-wrap; }
  .st-ok { color: #3fb950; white-space: nowrap; }
  .st-todo { color: #8b949e; white-space: nowrap; }
  .summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  .sum-pill { background: #161b22; border: 1px solid #30363d; border-radius: 999px; padding: 4px 14px; font-size: 13px; }
  .sum-ok { color: #3fb950; }
  .sum-todo { color: #d29922; }
  .filters { display: inline-flex; gap: 6px; }
  .filters button { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 14px; font: inherit; cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: #58a6ff; color: #58a6ff; }
  /* 行内密钥操作（免进设置逐个选） */
  .kact { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kact .kin { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 8px; width: 210px; font-size: 12px; }
  .kact .kin:focus-visible { border-color: #58a6ff; outline: 2px solid #58a6ff; outline-offset: 1px; }
  .kact .act { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .kact .act.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .kact .act:disabled { opacity: .55; cursor: wait; }
  .kact .kmsg { color: #3fb950; font-size: 11px; }
  .kact a { color: #58a6ff; text-decoration: none; white-space: nowrap; }
  /* 视觉隐藏、读屏可见（跳转链接）；聚焦时现身。 */
  .vh:where(:not(:focus, :active)) { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; overflow: hidden !important; clip-path: inset(50%) !important; white-space: nowrap !important; border: 0 !important; }
  .skip:focus { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 6px 12px; background: #1f6feb; color: #fff; border-radius: 6px; text-decoration: none; }
  /* 跳转链接落点：内容区获得焦点时给一圈细线，说明"你在这里"。 */
  main:focus { outline: 2px solid #58a6ff; outline-offset: -2px; }
</style>
<script src="assets/gsap.min.js" defer></script>
<script src="assets/motion.js" defer></script>
</head>
<body>
<a class="vh skip" href="#main" data-i18n="skip_main">Skip to main content</a>
<header>
  <h1 id="pageTitle" data-i18n="page_title">OmniFusion · Keys</h1>
  <nav id="nav" data-i18n-aria="nav_label"></nav>
</header>
<main id="main" tabindex="-1">
<p class="meta" id="meta"></p>
<div class="summary">
  <span class="sum-pill" id="sum-ok"></span>
  <span class="sum-pill" id="sum-todo"></span>
  <span class="filters">
    <button id="f-all" type="button" aria-pressed="true"></button>
    <button id="f-todo" type="button" aria-pressed="false"></button>
  </span>
</div>
<div id="err" role="status"></div>
<table aria-labelledby="pageTitle">
  <thead><tr>
    <th scope="col" data-i18n="th_provider">provider</th><th scope="col" data-i18n="th_source">source</th><th scope="col" data-i18n="th_updated">updated</th><th scope="col" data-i18n="th_status">status</th><th scope="col" data-i18n="th_action">action</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</main>
<script>
'use strict';
// --- i18n (pattern shared across dashboard pages) ---
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('ofd-lang');
  const nav = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const lang = (q === 'zh' || q === 'en') ? q : ((saved === 'zh' || saved === 'en') ? saved : nav);
  try { localStorage.setItem('ofd-lang', lang); } catch (e) {}
  return lang;
})();
const I18N = {
  en: {
    page_title: 'OmniFusion · Keys',
    nav_label: 'Pages', skip_main: 'Skip to main content',
    nav_providers: 'Providers', nav_keys: 'Keys', nav_usage: 'Usage',
    nav_compression: 'Compression', nav_resilience: 'Resilience', nav_chat: 'Chat',
    th_provider: 'Providers', th_source: 'source', th_updated: 'updated', th_status: 'status', th_action: 'action',
    apply: 'apply ↗',
    status_ok: '✓ configured', status_todo: '— no key yet', status_keyless: '⚡ keyless ready',
    act_add: 'Add key', act_update: 'Update', act_saving: 'Saving…',
    act_stored: '✓ stored — restart the gateway to activate',
    act_apply_first: 'Get a key from the official page first ↗',
    act_placeholder: 'Paste API key…',
    sum_ok: '{n} configured', sum_todo: '{n} to apply',
    f_all: 'All', f_todo: 'To apply',
    empty: 'no keys — add one inline below or export *_API_KEY',
    meta: '{n} keys · refreshed {time}',
  },
  zh: {
    page_title: 'OmniFusion · 密钥',
    nav_label: '页面', skip_main: '跳到主要内容',
    nav_providers: '提供商', nav_keys: '密钥', nav_usage: '用量',
    nav_compression: '压缩', nav_resilience: '弹性', nav_chat: '对话',
    th_provider: '提供商', th_source: '密钥来源', th_updated: '更新于', th_status: '状态', th_action: '操作',
    apply: '去申请 ↗',
    status_ok: '✓ 已添加', status_todo: '— 待申请/添加', status_keyless: '⚡ 免密可用',
    act_add: '添加密钥', act_update: '更新', act_saving: '保存中…',
    act_stored: '✓ 已添加 — 重启网关后生效',
    act_apply_first: '先去官方页申请密钥 ↗',
    act_placeholder: '粘贴 API 密钥…',
    sum_ok: '已添加 {n} 家', sum_todo: '待申请 {n} 家',
    f_all: '全部', f_todo: '待申请',
    empty: '未配置任何密钥 — 可在下方行内添加，或导出 *_API_KEY',
    meta: '{n} 个密钥 · 刷新于 {time}',
  },
};
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });

const key = new URLSearchParams(location.search).get('key') || '';
const PAGES = [['providers','nav_providers'],['keys','nav_keys'],['usage','nav_usage'],
               ['compression','nav_compression'],['resilience','nav_resilience'],['chat','nav_chat']];
const pageHref = (id, lang) => id + '.html?' + (key ? 'key=' + encodeURIComponent(key) + '&' : '') + 'lang=' + lang;
const EMBED = new URLSearchParams(location.search).has('embed');
try { document.cookie = 'ofdPageLoaded=' + Date.now() + '; path=/; SameSite=Lax'; } catch (e) {} // 桌面端内嵌：壳是唯一语言/导航控制源
{
  const nav = document.getElementById('nav');
  if (EMBED) {
    nav.hidden = true;
    document.querySelector('.skip').hidden = true;
  } else {
    const link = (href, text) => { const a = document.createElement('a'); a.href = href; a.textContent = text; return a; };
    nav.replaceChildren(
      ...PAGES.map(([id, nk]) => {
        const a = link(pageHref(id, LANG), t(nk));
        if (id === 'keys') a.setAttribute('aria-current', 'page');
        return a;
      }),
      link(pageHref('keys', 'zh'), '中文'), link(pageHref('keys', 'en'), 'EN'),
    );
  }
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function srcClass(s) { return s.startsWith('env:') ? 'src-env' : s === 'stored' ? 'src-stored' : s === 'none' ? 'src-none' : ''; }
function vname(id) { if (!(window.OFD && window.OFD.motion)) return esc(id); return esc(OFD.motion.vendorName(id, LANG)) + ' <span class="meta">(' + esc(id) + ')</span>'; }

let filterTodo = false; // 待申请筛选（5s 轮询重渲染时保持）

function setFilter(todo) {
  filterTodo = todo;
  document.getElementById('f-all').setAttribute('aria-pressed', String(!todo));
  document.getElementById('f-todo').setAttribute('aria-pressed', String(todo));
  load();
}
document.getElementById('f-all').onclick = () => setFilter(false);
document.getElementById('f-todo').onclick = () => setFilter(true);
document.getElementById('f-all').textContent = t('f_all');
document.getElementById('f-todo').textContent = t('f_todo');

// emptyRow 是"空表"提示行。
function emptyRow(text) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 5;
  td.className = 'empty';
  td.textContent = text;
  tr.append(td);
  return tr;
}

// reconcileRows 让 tbody 的子行与 order 一致：保留下来的行是同一个节点
//（输入内容、焦点都在），只挪位置不重建；挪动用 moveBefore 保住焦点等
// 状态，不支持的引擎退回普通插入。
function reconcileRows(tbody, order) {
  for (const tr of [...tbody.children]) if (!order.includes(tr)) tr.remove();
  order.forEach((tr, i) => {
    if (tbody.children[i] === tr) return; // 已在原位
    const ref = tbody.children[i] || null;
    if (tr.parentElement === tbody && 'moveBefore' in Element.prototype) {
      try { tbody.moveBefore(tr, ref); return; } catch (e) { /* 退回普通插入 */ }
    }
    tbody.insertBefore(tr, ref);
  });
}

// rowNode 渲染一个厂商的新行。行内控件从外表看全都一样（38 行"粘贴
// API 密钥"）：隐藏 label / aria-label 带上厂商名，读屏与语音控制才分得清。
function rowNode(k) {
  const cls = srcClass(k.source);
  const done = keyConfigured(k);
  const kl = keyless(k);
  const status = kl
    ? `<span class="st-ok">${t('status_keyless')}</span>`
    : done
      ? `<span class="st-ok">${t('status_ok')}</span>`
      : `<span class="st-todo">${t('status_todo')}</span>`;
  // 行内操作（用户需求：免进设置逐个选）——待申请行=「去申请↗ + 粘贴框
  // + 添加」；已添加行=「更新」（把焦点交给密钥框）+ 粘贴框 + 更新；
  // 免密行也可补 key 解锁更多模型（kilo 免费池之外）。
  const pid = esc(k.provider);
  const saveLabel = done && !kl ? t('act_update') : t('act_add');
  const apply = !done && !kl && k.signup_url
    ? `<a href="${esc(k.signup_url)}" target="_blank" rel="noopener noreferrer">${t('apply')}</a> ` : '';
  const upd = done && !kl
    ? `<button type="button" class="act" data-act="upd" data-p="${pid}" aria-label="${t('act_update')}: ${pid}">${t('act_update')}</button> `
    : '';
  const action = `<span class="kact">${apply}${upd}` +
    `<label class="vh" for="kin-${pid}">${t('act_placeholder')} (${pid})</label>` +
    `<input id="kin-${pid}" type="password" class="kin" data-p="${pid}" placeholder="${t('act_placeholder')}" aria-describedby="kmsg-${pid}" autocomplete="off" autocapitalize="off" spellcheck="false">` +
    `<button type="button" class="act primary" data-act="save" data-p="${pid}" aria-label="${saveLabel}: ${pid}">${saveLabel}</button>` +
    `<span class="kmsg" id="kmsg-${pid}" data-m="${pid}" role="status"></span></span>`;
  const tpl = document.createElement('template');
  tpl.innerHTML = `<tr data-p="${pid}"><td>${vname(k.provider)}</td><td${cls ? ` class="${cls}"` : ''}>${esc(k.source)}</td>` +
    `<td>${k.updated_at ? new Date(k.updated_at.replace(' ', 'T') + 'Z').toLocaleString() : '–'}</td>` +
    `<td>${status}</td><td>${action}</td></tr>`;
  return tpl.content.firstElementChild;
}

// keyConfigured 判定一行是否可用（stored=网关库；env:=环境变量；
// source "-" = optional_key 免密厂商（kilo 免费池/llm7/本地 ollama），
// 开箱即用而非待办——行内仍可补 key 解锁更多模型）。
function keyConfigured(k) { return k.source === 'stored' || k.source.startsWith('env:') || k.source === '-'; }
// keyless 判定免密厂商行（状态列显示专用标）。
function keyless(k) { return k.source === '-'; }

// 错误区是 live region（role="status"）：同一条错误不重复写入，读屏才不会每 5s 被念一遍。
const err = document.getElementById('err');
const setErr = (msg) => { if (err.textContent !== msg) err.textContent = msg; };

async function load(background = false) {
  try {
    const resp = await fetch('api/keys' + (key ? '?key=' + encodeURIComponent(key) : ''), background ? { priority: 'low' } : {});
    const body = await resp.json();
    setErr(resp.ok ? '' : (body.error && body.error.message) || `HTTP ${resp.status}`);
    if (!resp.ok) return;
    const rows = document.getElementById('rows');
    const all = body.keys || [];
    const configured = all.filter(keyConfigured);
    const todo = all.filter(k => !keyConfigured(k));
    // 顶部汇总（不随筛选变化——永远是全局进度）。
    document.getElementById('sum-ok').innerHTML =
      `<span class="sum-ok">${t('sum_ok').replace('{n}', configured.length)}</span>`;
    document.getElementById('sum-todo').innerHTML =
      `<span class="sum-todo">${t('sum_todo').replace('{n}', todo.length)}</span>`;
    const shown = filterTodo ? todo : all;
    if (!shown.length) {
      rows.replaceChildren(emptyRow(filterTodo ? t('f_todo') + ' ✓' : t('empty')));
    } else {
      // 保留编辑中行的现场（用户 2026-10-01 反馈：5s 轮询把输入框和
      // 未读反馈冲掉=失控感）：输入框有内容、行内有未读反馈、或行内正
      // 持有焦点的行，轮询时沿用同一个 <tr> 节点，只重绘其他行。
      //（此前是序列化成 outerHTML 再解析——输入框里已输入的值不在
      // 序列化结果里，下一次轮询就被清空；焦点也会丢。）
      const frozen = new Map(); // provider → 现有的 <tr>
      rows.querySelectorAll('tr[data-p]').forEach(tr => {
        const inp = tr.querySelector('input.kin');
        const msg = tr.querySelector('.kmsg');
        if ((inp && inp.value.trim()) || (msg && msg.textContent) || tr.contains(document.activeElement)) frozen.set(tr.dataset.p, tr);
      });
      const order = shown.map(k => frozen.get(k.provider) || rowNode(k));
      reconcileRows(rows, order);
    }
    if (window.OFD) OFD.motion.rows(document.getElementById('rows'));
    document.getElementById('meta').textContent =
      t('meta').replace('{n}', all.length).replace('{time}', new Date().toLocaleTimeString());
  } catch (e) {
    setErr(String(e));
  }
}
load();
// 轮询只在页面可见时进行，回到页面立即补刷；后台刷新请求走低优先级，
// 不与用户触发的请求抢带宽。
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 5000);

// 行内密钥保存（事件委托——5s 轮询整表重渲染，挂 tbody 才不丢）。
// 仅 master 网关 key 可写（服务端精确比对；scoped token 403）。
const rowsEl = document.getElementById('rows');
const findIn = (sel, attr, p) => rowsEl.querySelector(attr + '[data-p="' + CSS.escape(p) + '"] ' + sel + ', ' + attr + '[data-p="' + CSS.escape(p) + '"]');
rowsEl.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button.act');
  if (!btn) return;
  const p = btn.dataset.p;
  if (btn.dataset.act === 'upd') { // 「更新」：把焦点交给同一行的密钥框
    const inp = rowsEl.querySelector('input.kin[data-p="' + CSS.escape(p) + '"]');
    if (inp) inp.focus();
    return;
  }
  if (btn.dataset.act !== 'save') return;
  const input = rowsEl.querySelector('input.kin[data-p="' + CSS.escape(p) + '"]');
  const msg = rowsEl.querySelector('.kmsg[data-m="' + CSS.escape(p) + '"]');
  if (!input || !input.value.trim()) { if (msg) msg.textContent = ''; if (input) input.focus(); return; }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = t('act_saving');
  try {
    const resp = await fetch('api/keys/set' + (key ? '?key=' + encodeURIComponent(key) : ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: p, key: input.value.trim() }),
    });
    const body = await resp.json().catch(() => ({}));
    if (resp.ok && body.ok) {
      input.value = '';
      if (msg) msg.textContent = t('act_stored'); // 冻结行保留反馈，直至用户再次编辑
      load(); // 刷新其他行；本行带着"已添加"反馈保持冻结，直到用户再次编辑
    } else {
      if (msg) msg.textContent = (body.error && body.error.message) || ('HTTP ' + resp.status);
    }
  } catch (e) {
    if (msg) msg.textContent = String(e);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
});
// 回车=提交（同委托）。
document.getElementById('rows').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' || ev.isComposing || ev.keyCode === 229) return; // 输入法组合态的回车是"上屏"
  const input = ev.target.closest('input.kin');
  if (!input) return;
  const btn = input.closest('.kact').querySelector('button[data-act="save"]');
  if (btn) btn.click();
});
// 用户再次输入时清除上一轮反馈（解除该行冻结，回到正常轮询）。
rowsEl.addEventListener('input', (ev) => {
  const input = ev.target.closest('input.kin');
  if (!input) return;
  const msg = rowsEl.querySelector('.kmsg[data-m="' + CSS.escape(input.dataset.p) + '"]');
  if (msg && msg.textContent) msg.textContent = '';
});
</script>
</body>
</html>
