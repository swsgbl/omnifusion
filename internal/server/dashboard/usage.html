<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">OmniFusion · Usage</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; }
  nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  nav a[aria-current] { color: #e6edf3; text-decoration: underline; }
  .meta { color: #8b949e; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; width: 90px; height: 8px; background: #21262d; border-radius: 4px; vertical-align: middle; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: #3fb950; }
  .hr-warn > span { background: #d29922; }
  .hr-low > span { background: #f85149; }
  .empty { color: #8b949e; padding: 24px 0; }
  #err { color: #f85149; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="page_title">OmniFusion · Usage</h1>
  <nav id="nav"></nav>
</header>
<p class="meta" id="meta"></p>
<div id="err"></div>
<table>
  <thead><tr>
    <th data-i18n="th_provider">provider</th><th class="num" data-i18n="th_rpm">rpm / limit</th><th class="num" data-i18n="th_rpd">rpd / limit</th>
    <th class="num" data-i18n="th_tpm">tpm / limit</th><th class="num" data-i18n="th_tpd">tpd / limit</th><th data-i18n="th_headroom">headroom</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
'use strict';
// --- i18n (pattern shared across dashboard pages) ---
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('ofd-lang');
  const nav = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const lang = (q === 'zh' || q === 'en') ? q : ((saved === 'zh' || saved === 'en') ? saved : nav);
  try { localStorage.setItem('ofd-lang', lang); } catch (e) {}
  return lang;
})();
const I18N = {
  en: {
    page_title: 'OmniFusion · Usage',
    nav_providers: 'Providers', nav_keys: 'Keys', nav_usage: 'Usage',
    nav_compression: 'Compression', nav_resilience: 'Resilience', nav_chat: 'Chat',
    th_provider: 'provider', th_rpm: 'rpm / limit', th_rpd: 'rpd / limit',
    th_tpm: 'tpm / limit', th_tpd: 'tpd / limit', th_headroom: 'headroom',
    bar_open: 'open',
    empty: 'no traffic yet',
    meta: 'sliding windows: 1m / 24h · semantic cache: {n} entries · refreshed {time}',
  },
  zh: {
    page_title: 'OmniFusion · 用量',
    nav_providers: '提供商', nav_keys: '密钥', nav_usage: '用量',
    nav_compression: '压缩', nav_resilience: '弹性', nav_chat: '对话',
    th_provider: '提供商', th_rpm: 'rpm / 上限', th_rpd: 'rpd / 上限',
    th_tpm: 'tpm / 上限', th_tpd: 'tpd / 上限', th_headroom: '余量',
    bar_open: '不限',
    empty: '暂无流量',
    meta: '滑动窗口：1m / 24h · 语义缓存：{n} 条 · 刷新于 {time}',
  },
};
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

const key = new URLSearchParams(location.search).get('key') || '';
const PAGES = [['providers','nav_providers'],['keys','nav_keys'],['usage','nav_usage'],
               ['compression','nav_compression'],['resilience','nav_resilience'],['chat','nav_chat']];
const pageHref = (id, lang) => id + '.html?' + (key ? 'key=' + encodeURIComponent(key) + '&' : '') + 'lang=' + lang;
const EMBED = new URLSearchParams(location.search).has('embed'); // 桌面端内嵌：壳是唯一语言/导航控制源
if (!EMBED) document.getElementById('nav').innerHTML = PAGES.map(([id, nk]) => {
  const cur = id === 'usage' ? ' aria-current="page"' : '';
  return `<a href="${pageHref(id, LANG)}"${cur}>${t(nk)}</a>`;
}).join('') +
  ` <a href="${pageHref('usage', 'zh')}">中文</a> <a href="${pageHref('usage', 'en')}">EN</a>`;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(used, limit) {
  const u = used >= 10000 ? (used / 1000).toFixed(0) + 'k' : String(used);
  return limit > 0 ? `${u} / ${limit}` : `${u} / –`;
}
function bar(h) {
  const pct = Math.max(0, Math.min(1, h)) * 100;
  const cls = h < 0.1 ? ' hr-low' : h < 0.4 ? ' hr-warn' : '';
  const unlimited = h >= 1;
  return `<span class="bar${cls}"><span data-pct="${unlimited ? 100 : pct}" style="width:${unlimited ? 100 : pct}%"></span></span> ` +
    `<span class="meta">${unlimited ? t('bar_open') : pct.toFixed(0) + '%'}</span>`;
}
function cell(cls, text) { return `<td${cls ? ` class="${cls}"` : ''}>${text}</td>`; }

async function load() {
  const err = document.getElementById('err');
  try {
    const resp = await fetch('api/usage' + (key ? '?key=' + encodeURIComponent(key) : ''));
    const body = await resp.json();
    err.textContent = resp.ok ? '' : (body.error && body.error.message) || `HTTP ${resp.status}`;
    if (!resp.ok) return;
    const rows = document.getElementById('rows');
    if (!body.usage.length) {
      rows.innerHTML = `<tr><td colspan="6" class="empty">${t('empty')}</td></tr>`;
    } else {
      rows.innerHTML = body.usage.map(u => '<tr>' + [
        cell('', esc(OFD.pname(u.provider, LANG))),
        cell('num', fmt(u.rpm, u.limits.rpm)),
        cell('num', fmt(u.rpd, u.limits.rpd)),
        cell('num', fmt(u.tpm, u.limits.tpm)),
        cell('num', fmt(u.tpd, u.limits.tpd)),
        cell('', bar(u.headroom)),
      ].join('') + '</tr>').join('');
    }
    if (window.OFD) {
      OFD.motion.rows(document.getElementById('rows'));
      document.querySelectorAll('#rows .bar > span').forEach(s => OFD.motion.bar(s, parseFloat(s.dataset.pct)));
    }
    document.getElementById('meta').textContent =
      t('meta').replace('{n}', body.cache_entries).replace('{time}', new Date().toLocaleTimeString());
  } catch (e) {
    err.textContent = String(e);
  }
}
load();
setInterval(load, 5000);
</script>
<script src="assets/gsap.min.js"></script>
<script src="assets/providers-meta.js"></script>
<script src="assets/motion.js"></script>
</body>
</html>
