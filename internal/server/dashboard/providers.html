<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">OmniFusion · Providers</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; }
  nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  nav a[aria-current] { color: #e6edf3; text-decoration: underline; }
  .meta { color: #8b949e; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cd { color: #f85149; font-size: 12px; }
  .empty { color: #8b949e; padding: 24px 0; }
  #err { color: #f85149; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="page_title">OmniFusion · Providers</h1>
  <nav id="nav"></nav>
</header>
<p class="meta" id="meta"></p>
<div id="err"></div>
<table>
  <thead><tr>
    <th data-i18n="th_provider">provider</th><th class="num" data-i18n="th_models">models</th><th class="num" data-i18n="th_latency">latency ms</th>
    <th class="num" data-i18n="th_success">success</th><th data-i18n="th_last_success">last success</th><th data-i18n="th_cooldowns">cooldowns</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
'use strict';
// --- i18n (pattern shared across dashboard pages) ---
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('ofd-lang');
  const nav = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const lang = (q === 'zh' || q === 'en') ? q : ((saved === 'zh' || saved === 'en') ? saved : nav);
  try { localStorage.setItem('ofd-lang', lang); } catch (e) {}
  return lang;
})();
const I18N = {
  en: {
    page_title: 'OmniFusion · Providers',
    nav_providers: 'Providers', nav_keys: 'Keys', nav_usage: 'Usage',
    nav_compression: 'Compression', nav_resilience: 'Resilience', nav_chat: 'Chat',
    th_provider: 'provider', th_models: 'models', th_latency: 'latency ms',
    th_success: 'success', th_last_success: 'last success', th_cooldowns: 'cooldowns',
    empty: 'no providers configured',
    meta: '{p} providers · {m} models · refreshed {time}',
    cd_model: 'model {m} until {time} ({reason})',
    cd_plain: 'until {time} ({reason})',
  },
  zh: {
    page_title: 'OmniFusion · 提供商',
    nav_providers: '提供商', nav_keys: '密钥', nav_usage: '用量',
    nav_compression: '压缩', nav_resilience: '弹性', nav_chat: '对话',
    th_provider: '提供商', th_models: '模型数', th_latency: '延迟 ms',
    th_success: '成功率', th_last_success: '最近成功', th_cooldowns: '冷却',
    empty: '未配置任何提供商',
    meta: '{p} 个提供商 · {m} 个模型 · 刷新于 {time}',
    cd_model: '模型 {m} 直至 {time}（{reason}）',
    cd_plain: '直至 {time}（{reason}）',
  },
};
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

const key = new URLSearchParams(location.search).get('key') || '';
const PAGES = [['providers','nav_providers'],['keys','nav_keys'],['usage','nav_usage'],
               ['compression','nav_compression'],['resilience','nav_resilience'],['chat','nav_chat']];
const pageHref = (id, lang) => id + '.html?' + (key ? 'key=' + encodeURIComponent(key) + '&' : '') + 'lang=' + lang;
const EMBED = new URLSearchParams(location.search).has('embed'); // 桌面端内嵌：壳是唯一语言/导航控制源
if (!EMBED) document.getElementById('nav').innerHTML = PAGES.map(([id, nk]) => {
  const cur = id === 'providers' ? ' aria-current="page"' : '';
  return `<a href="${pageHref(id, LANG)}"${cur}>${t(nk)}</a>`;
}).join('') +
  ` <a href="${pageHref('providers', 'zh')}">中文</a> <a href="${pageHref('providers', 'en')}">EN</a>`;

function cell(cls, text) { return `<td${cls ? ` class="${cls}"` : ''}>${text}</td>`; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load() {
  const err = document.getElementById('err');
  try {
    const resp = await fetch('api/providers' + (key ? '?key=' + encodeURIComponent(key) : ''));
    const body = await resp.json();
    err.textContent = resp.ok ? '' : (body.error && body.error.message) || `HTTP ${resp.status}`;
    if (!resp.ok) return;
    const rows = document.getElementById('rows');
    if (!body.providers.length) {
      rows.innerHTML = `<tr><td colspan="6" class="empty">${t('empty')}</td></tr>`;
    } else {
      rows.innerHTML = body.providers.map(p => '<tr>' + [
        cell('', esc(p.name)),
        cell('num', p.models),
        cell('num', p.latency_ms ? p.latency_ms.toFixed(0) : '–'),
        cell('num', p.success_rate > 0 ? (p.success_rate * 100).toFixed(0) + '%' : '–'),
        cell('', p.last_success_at ? new Date(p.last_success_at).toLocaleString() : '–'),
        cell('', (p.cooldowns || []).map(c => esc((c.scope === 'model' ? t('cd_model').replace('{m}', c.model) : t('cd_plain'))
          .replace('{time}', new Date(c.until).toLocaleTimeString())
          .replace('{reason}', c.reason))).join('<br>') || '–'),
      ].join('') + '</tr>').join('');
    }
    document.getElementById('meta').textContent =
      t('meta').replace('{p}', body.providers.length).replace('{m}', body.models_total).replace('{time}', new Date().toLocaleTimeString());
  } catch (e) {
    err.textContent = String(e);
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
