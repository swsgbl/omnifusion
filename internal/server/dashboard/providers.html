<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">OmniFusion · Providers</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; }
  nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  nav a[aria-current] { color: #e6edf3; text-decoration: underline; }
  .meta { color: #8b949e; font-size: 12px; }
  #btnSync { margin-left: 8px; padding: 2px 10px; font-size: 12px; background: #161b22;
             color: #58a6ff; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; }
  #btnSync:hover:not(:disabled) { border-color: #58a6ff; }
  #btnSync:disabled { opacity: .5; cursor: default; }
  /* 表头吸顶：长表滚动时列含义不丢（separate 让表头的边框跟着吸顶走）。 */
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  thead th { position: sticky; inset-block-start: 0; z-index: 1; background: #0d1117; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cd { color: #f85149; font-size: 12px; }
  .ent-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
  .ent-free { background: rgba(63,185,80,.16); color: #3fb950; }
  .ent-paid { background: rgba(218,54,52,.14); color: #f85149; }
  .ent-unknown { background: rgba(139,148,158,.12); color: #8b949e; }
  .ent-meta { color: #8b949e; font-size: 11px; margin-top: 2px; }
  .empty { color: #8b949e; padding: 24px 0; }
  #err { color: #f85149; white-space: pre-wrap; }
  /* 模型展开面（模型数列可点 → 勾选启停） */
  tr.pdetail > td { background: rgba(22,27,34,.6); padding: 12px 18px; }
  .pstat { display: inline-block; min-width: 14px; text-align: center; font-weight: 700; border-radius: 4px; padding: 0 4px; }
  .pstat.st-available { color: #3fb950; }
  .pstat.st-unavailable { color: #f85149; background: rgba(248,81,73,.12); }
  .pstat.st-throttled { color: #d29922; }
  .pstat.st-unknown { color: #8b949e; }
  button.mlink { color: #58a6ff; background: none; border: none; padding: 0; font: inherit; cursor: pointer;
                   text-decoration: underline dotted; text-decoration-color: #58a6ff; text-underline-offset: 3px; }
  .pmodels { display: flex; flex-wrap: wrap; gap: 6px 14px; max-height: 240px; overflow-y: auto; }
  .pm { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12.5px; }
  .pm input { accent-color: #1f6feb; }
  .pm.off .pmid { color: #8b949e; text-decoration: line-through; }
  .pmctx { color: #8b949e; font-size: 11px; }
  .pact { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .pact button { background: #1f6feb; border: 1px solid #1f6feb; color: #fff; border-radius: 6px; padding: 5px 14px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .pact button:disabled { opacity: .55; cursor: wait; }
  .pmsg { color: #3fb950; font-size: 12px; }
  .phint { color: #8b949e; font-size: 11px; }
  .pload, .perr { color: #8b949e; font-size: 12px; }
  .perr { color: #f85149; }
  /* 视觉隐藏、读屏可见（跳转链接）；聚焦时现身。 */
  .vh:where(:not(:focus, :active)) { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; overflow: hidden !important; clip-path: inset(50%) !important; white-space: nowrap !important; border: 0 !important; }
  .skip:focus { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 6px 12px; background: #1f6feb; color: #fff; border-radius: 6px; text-decoration: none; }
  /* 跳转链接落点：内容区获得焦点时给一圈细线，说明"你在这里"。 */
  main:focus { outline: 2px solid #58a6ff; outline-offset: -2px; }
</style>
<script src="assets/gsap.min.js" defer></script>
<script src="assets/motion.js" defer></script>
</head>
<body>
<a class="vh skip" href="#main" data-i18n="skip_main">Skip to main content</a>
<header>
  <h1 id="pageTitle" data-i18n="page_title">OmniFusion · Providers</h1>
  <nav id="nav" data-i18n-aria="nav_label"></nav>
</header>
<main id="main" tabindex="-1">
<p class="meta" id="meta"></p>
<p class="meta"><span id="syncinfo"></span><button id="btnSync" data-i18n="refresh_models">Refresh models</button></p>
<div id="err" role="status"></div>
<table aria-labelledby="pageTitle">
  <thead><tr>
    <th scope="col" data-i18n="th_provider">provider</th><th class="num" scope="col" data-i18n="th_models">models</th><th class="num" scope="col" data-i18n="th_latency">latency ms</th>
    <th class="num" scope="col" data-i18n="th_success">success</th><th scope="col" data-i18n="th_entitlement">free tier</th><th scope="col" data-i18n="th_last_success">last success</th><th scope="col" data-i18n="th_cooldowns">cooldowns</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</main>
<script>
'use strict';
// --- i18n (pattern shared across dashboard pages) ---
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('ofd-lang');
  const nav = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const lang = (q === 'zh' || q === 'en') ? q : ((saved === 'zh' || saved === 'en') ? saved : nav);
  try { localStorage.setItem('ofd-lang', lang); } catch (e) {}
  return lang;
})();
const I18N = {
  en: {
    page_title: 'OmniFusion · Providers',
    nav_label: 'Pages', skip_main: 'Skip to main content',
    nav_providers: 'Providers', nav_keys: 'Keys', nav_usage: 'Usage',
    nav_compression: 'Compression', nav_resilience: 'Resilience', nav_chat: 'Chat',
    th_provider: 'provider', th_models: 'models', th_latency: 'latency ms',
    th_success: 'success', th_entitlement: 'free tier', th_last_success: 'last success', th_cooldowns: 'cooldowns',
    ent_unknown: 'unknown', ent_free: 'free ✓', ent_paid: 'paid', ent_expired: 'stale evidence', ent_disabled: 'disabled',
    ent_remaining: '{r}% left', ent_observed: 'observed {time} · {source}', ent_source_runtime_429: 'runtime 429', ent_source_runtime_usage: 'runtime usage',
    ent_source_active_probe: 'probe', ent_source_official_doc: 'official doc', ent_source_static_catalog: 'catalog', ent_source_manual: 'manual',
    empty: 'no providers configured',
    meta: '{p} providers · {m} models · refreshed {time}',
    sync_auto: 'model catalog auto-refreshes hourly; last sync {time}',
    sync_never: 'model catalog not synced yet (auto-refreshes hourly)',
    refresh_models: 'Refresh models',
    refresh_started: 'Refreshing…',
    cd_model: 'model {m} until {time} ({reason})',
    cd_plain: 'until {time} ({reason})',
    pmodels_empty: 'no models in catalog yet (sync first)',
    pmodels_save: 'Save switches',
    pmodels_saved: '✓ saved — takes effect immediately',
    pmodels_hint: 'unchecked = excluded from routing (instant, survives restart)',
    probe_btn: 'Probe availability',
    probe_running: 'Probing… (tiny real request per model, up to 90s)',
    probe_hint: 'probe = one tiny real request per model (~20 tokens): ✓ usable / ✗ gateway refuses / ⚠ rate-limited / ? no verdict',
    probe_st_available: '✓', probe_st_unavailable: '✗', probe_st_throttled: '⚠', probe_st_unknown: '?',
  },
  zh: {
    page_title: 'OmniFusion · 提供商',
    nav_label: '页面', skip_main: '跳到主要内容',
    nav_providers: '提供商', nav_keys: '密钥', nav_usage: '用量',
    nav_compression: '压缩', nav_resilience: '弹性', nav_chat: '对话',
    th_provider: '提供商', th_models: '模型数', th_latency: '延迟 ms',
    th_success: '成功率', th_entitlement: '免费层', th_last_success: '最近成功', th_cooldowns: '冷却',
    ent_unknown: '未知', ent_free: '免费 ✓', ent_paid: '已付费', ent_expired: '证据过期', ent_disabled: '已停用',
    ent_remaining: '余量 {r}%', ent_observed: '观测于 {time} · {source}', ent_source_runtime_429: '运行时 429', ent_source_runtime_usage: '运行时用量',
    ent_source_active_probe: '主动探测', ent_source_official_doc: '官方文档', ent_source_static_catalog: '目录声明', ent_source_manual: '人工',
    empty: '未配置任何提供商',
    meta: '{p} 个提供商 · {m} 个模型 · 刷新于 {time}',
    sync_auto: '模型目录每小时自动刷新；上次同步 {time}',
    sync_never: '模型目录尚未同步（每小时自动刷新）',
    refresh_models: '刷新模型',
    refresh_started: '正在刷新…',
    cd_model: '模型 {m} 直至 {time}（{reason}）',
    cd_plain: '直至 {time}（{reason}）',
    pmodels_empty: '目录中暂无该厂商模型（先刷新目录）',
    pmodels_save: '保存开关',
    pmodels_saved: '✓ 已保存 — 立即生效',
    pmodels_hint: '取消勾选 = 路由不再使用该模型（立即生效，重启保留）',
    probe_btn: '探测可用性',
    probe_running: '探测中…（每模型一条极小真实请求，最长 90 秒）',
    probe_hint: '探测 = 每模型发一条极小真实请求（约 20 tokens）：✓ 可用 / ✗ 网关拒收 / ⚠ 限流 / ? 无定论',
    probe_st_available: '✓', probe_st_unavailable: '✗', probe_st_throttled: '⚠', probe_st_unknown: '?',
  },
};
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });

const key = new URLSearchParams(location.search).get('key') || '';
const PAGES = [['providers','nav_providers'],['keys','nav_keys'],['usage','nav_usage'],
               ['compression','nav_compression'],['resilience','nav_resilience'],['chat','nav_chat']];
const pageHref = (id, lang) => id + '.html?' + (key ? 'key=' + encodeURIComponent(key) + '&' : '') + 'lang=' + lang;
const EMBED = new URLSearchParams(location.search).has('embed');
try { document.cookie = 'ofdPageLoaded=' + Date.now() + '; path=/; SameSite=Lax'; } catch (e) {} // 桌面端内嵌：壳是唯一语言/导航控制源
{
  const nav = document.getElementById('nav');
  if (EMBED) {
    nav.hidden = true;
    document.querySelector('.skip').hidden = true;
  } else {
    const link = (href, text) => { const a = document.createElement('a'); a.href = href; a.textContent = text; return a; };
    nav.replaceChildren(
      ...PAGES.map(([id, nk]) => {
        const a = link(pageHref(id, LANG), t(nk));
        if (id === 'providers') a.setAttribute('aria-current', 'page');
        return a;
      }),
      link(pageHref('providers', 'zh'), '中文'), link(pageHref('providers', 'en'), 'EN'),
    );
  }
}

function cell(cls, text) { return `<td${cls ? ` class="${cls}"` : ''}>${text}</td>`; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function vname(id) { if (!(window.OFD && window.OFD.motion)) return esc(id); return esc(OFD.motion.vendorName(id, LANG)) + ' <span class="meta">(' + esc(id) + ')</span>'; }
// entCell 把账本五态渲染为徽标+证据说明（蓝图 Phase 3 可视面）。
function entCell(e) {
  if (!e) return cell('', '–'); // Ledger 未装配：不确定不吓人
  const labels = { UNKNOWN: 'ent_unknown', VERIFIED_FREE: 'ent_free', VERIFIED_PAID: 'ent_paid', EXPIRED: 'ent_expired', DISABLED: 'ent_disabled' };
  const cls = e.state === 'VERIFIED_FREE' ? 'free' : (e.state === 'VERIFIED_PAID' || e.state === 'DISABLED') ? 'paid' : 'unknown';
  let main = `<span class="ent-badge ent-${cls}">${t(labels[e.state] || 'ent_unknown')}</span>`;
  if (e.state === 'VERIFIED_FREE' && e.remaining >= 0) {
    main += ` <span class="ent-meta">${t('ent_remaining').replace('{r}', Math.round(e.remaining * 100))}</span>`;
  }
  if (e.observed_at) {
    const srcKey = 'ent_source_' + (e.source || '').replace(/-/g, '_');
    const src = I18N[LANG] && I18N[LANG][srcKey] ? I18N[LANG][srcKey] : esc(e.source || '');
    main += `<div class="ent-meta">${t('ent_observed').replace('{time}', new Date(e.observed_at).toLocaleString()).replace('{source}', src)}</div>`;
  }
  return cell('', main);
}

// 模型展开面（用户 2026-10-01 需求）：点击模型数展开该 provider 的
// 模型清单（勾选=启用/停用 + 保存）。展开状态跨 5s 轮询保持；编辑中
// （有未保存勾选）的行冻结不重渲染。
let expandedProvider = null;   // 当前展开的 provider id
const dirtyProviders = new Set(); // 有未保存修改的 provider（轮询冻结）
const probeStates = {};          // provider → {model: {state, latency_ms}}（最近一轮探测）
let lastModels = [];             // 最近一次展开拉取的模型清单（探测后重绘用）

// moveAfter 把 node 挪到 ref 后面，并保住它的连接状态（焦点、勾选、动画）。
// 普通的 remove + insert 会让这些状态全部丢失；moveBefore 尚未在所有
// 引擎落地（Safari 不支持），所以先探测、异常时退回普通插入。
function moveAfter(parent, node, ref) {
  if (ref.nextSibling === node) return;
  if ('moveBefore' in Element.prototype) {
    try { parent.moveBefore(node, ref.nextSibling); return; } catch (e) { /* 退回普通插入 */ }
  }
  ref.after(node);
}

const mainRowOf = (name) => document.getElementById('rows').querySelector('tr[data-p="' + CSS.escape(name) + '"]');

// setExpandedState 同步模型数按钮的展开态：aria-expanded 常在；aria-controls
// 只在展开时挂——指向不存在的 id 会被辅助技术判为无效引用。
function setExpandedState(mainRow, open) {
  const btn = mainRow && mainRow.querySelector('button.mlink');
  if (!btn) return;
  btn.setAttribute('aria-expanded', String(open));
  if (open) btn.setAttribute('aria-controls', 'pdetail'); else btn.removeAttribute('aria-controls');
}

async function toggleExpand(name) {
  if (expandedProvider === name) {
    expandedProvider = null;
    setExpandedState(mainRowOf(name), false);
    renderDetailRow();
    return;
  }
  expandedProvider = name;
  setExpandedState(mainRowOf(name), true);
  renderDetailRow('loading');
  await loadDetail(name);
}

// loadDetail 拉取某厂商的模型清单并重绘展开的详情行——用户展开与轮询
// 发现详情行丢失时共用。
async function loadDetail(name, background = false) {
  const opts = background ? { priority: 'low' } : {};
  try {
    const resp = await fetch('api/provider/models?provider=' + encodeURIComponent(name) + (key ? '&key=' + encodeURIComponent(key) : ''), opts);
    const body = await resp.json();
    if (expandedProvider !== name) return; // 轮询间隙用户已切换
    lastModels = body.models || [];
    renderDetailRow(null, lastModels);
    // 恢复最近一轮探测结论（网关内存缓存；无记录静默跳过）。
    try {
      const pr = await fetch('api/provider/probe?provider=' + encodeURIComponent(name) + (key ? '&key=' + encodeURIComponent(key) : ''), opts);
      const pb = await pr.json();
      if (expandedProvider === name && pr.ok && pb.results && pb.results.length) {
        const pv = {};
        pb.results.forEach(r => { pv[r.model] = r; });
        probeStates[name] = pv;
        renderDetailRow(null, lastModels); // 带徽标重绘
      }
    } catch (e2) { /* 缓存恢复失败不打扰 */ }
  } catch (e) {
    renderDetailRow(null, [], String(e));
  }
}

// renderDetailRow 重绘展开的详情行（在主表行后插入）。
function renderDetailRow(state, models, errMsg) {
  document.querySelectorAll('tr.pdetail').forEach((el) => el.remove());
  if (!expandedProvider) return;
  const rows = document.getElementById('rows');
  const mainRow = rows.querySelector('tr[data-p="' + CSS.escape(expandedProvider) + '"]');
  if (!mainRow) return; // provider 行消失（网关重启等）
  const tr = document.createElement('tr');
  tr.className = 'pdetail';
  tr.id = 'pdetail';
  tr.dataset.p = expandedProvider;
  const td = document.createElement('td');
  td.colSpan = 7;
  if (state === 'loading') {
    td.innerHTML = '<span class="pload">…</span>';
  } else if (errMsg) {
    td.innerHTML = '<span class="perr">' + esc(errMsg) + '</span>';
  } else {
    if (!models.length) {
      td.innerHTML = '<span class="pload">' + t('pmodels_empty') + '</span>';
    } else {
      const pv = probeStates[expandedProvider] || {};
      const items = models.map(m => {
        const badge = pv[m.id]
          ? `<span class="pstat st-${esc(pv[m.id].state)}" title="${esc(pv[m.id].state)}${pv[m.id].latency_ms ? ' · ' + Math.round(pv[m.id].latency_ms) + 'ms' : ''}">${t('probe_st_' + pv[m.id].state)}</span>`
          : '';
        return `<label class="pm ${m.disabled ? 'off' : ''}">` +
        `<input type="checkbox" data-m="${esc(m.id)}" ${m.disabled ? '' : 'checked'}>` +
        `<span class="pmid">${esc(m.id)}</span>` +
        (m.ctx_len ? `<span class="pmctx">${m.ctx_len >= 1000000 ? (m.ctx_len / 1000000).toFixed(1) + 'M' : Math.round(m.ctx_len / 1000) + 'K'}</span>` : '') +
        badge +
        `</label>`;
      }).join('');
      td.innerHTML = '<div class="pmodels">' + items + '</div>' +
        `<div class="pact"><button type="button" id="pmSave">${t('pmodels_save')}</button>` +
        `<button type="button" id="pmProbe">${t('probe_btn')}</button>` +
        `<span class="pmsg" id="pmMsg" role="status"></span>` +
        `<span class="phint">${t('pmodels_hint')} · ${t('probe_hint')}</span></div>`;
    }
  }
  tr.appendChild(td);
  mainRow.after(tr);
  const probe = document.getElementById('pmProbe');
  if (probe) {
    probe.onclick = async () => {
      probe.disabled = true;
      dirtyProviders.add(expandedProvider); // 探测期间冻结轮询重渲染
      const msg = document.getElementById('pmMsg');
      if (msg) msg.textContent = t('probe_running');
      try {
        const resp = await fetch('api/provider/probe?provider=' + encodeURIComponent(expandedProvider) + (key ? '&key=' + encodeURIComponent(key) : ''), { method: 'POST' });
        const body = await resp.json().catch(() => ({}));
        if (resp.ok && body.results) {
          const pv = {};
          (body.results || []).forEach(r => { pv[r.model] = r; });
          probeStates[expandedProvider] = pv;
          renderDetailRow(null, lastModels, null); // 原地重绘带徽标
          const m2 = document.getElementById('pmMsg');
          if (m2) {
            const cnt = { available: 0, unavailable: 0, throttled: 0, unknown: 0 };
            (body.results || []).forEach(r => { if (cnt[r.state] !== undefined) cnt[r.state]++; });
            m2.textContent = '✓ ' + t('probe_st_available') + cnt.available + '  ' + t('probe_st_unavailable') + cnt.unavailable + '  ' + t('probe_st_throttled') + cnt.throttled + '  ' + t('probe_st_unknown') + cnt.unknown;
          }
        } else if (msg) {
          msg.textContent = (body.error && body.error.message) || ('HTTP ' + resp.status);
          probe.disabled = false;
          return;
        }
      } catch (e) {
        if (msg) msg.textContent = String(e);
      }
      const pb = document.getElementById('pmProbe');
      if (pb) pb.disabled = false;
    };
  }
  const save = document.getElementById('pmSave');
  if (save) {
    save.onclick = async () => {
      const disabled = [...td.querySelectorAll('input[type="checkbox"]:not(:checked)')].map(c => c.dataset.m);
      save.disabled = true;
      try {
        const resp = await fetch('api/provider/models/set?provider=' + encodeURIComponent(expandedProvider) + (key ? '&key=' + encodeURIComponent(key) : ''), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ disabled }),
        });
        const body = await resp.json().catch(() => ({}));
        const msg = document.getElementById('pmMsg');
        if (msg) msg.textContent = resp.ok && body.ok ? t('pmodels_saved') : (body.error && body.error.message) || ('HTTP ' + resp.status);
      } catch (e) {
        const msg = document.getElementById('pmMsg');
        if (msg) msg.textContent = String(e);
      } finally {
        save.disabled = false;
      }
    };
    // 勾选即标脏（轮询冻结该 provider 的重渲染）。
    td.querySelectorAll('input[type="checkbox"]').forEach(c =>
      c.addEventListener('change', () => dirtyProviders.add(expandedProvider)));
  }
}

// 错误区是 live region（role="status"）：同一条错误不重复写入，读屏才不会每 5s 被念一遍。
const err = document.getElementById('err');
const setErr = (msg) => { if (err.textContent !== msg) err.textContent = msg; };

async function load(background = false) {
  try {
    const resp = await fetch('api/providers' + (key ? '?key=' + encodeURIComponent(key) : ''), background ? { priority: 'low' } : {});
    const body = await resp.json();
    setErr(resp.ok ? '' : (body.error && body.error.message) || `HTTP ${resp.status}`);
    if (!resp.ok) return;
    const rows = document.getElementById('rows');
    // 模型数按钮若正持有键盘焦点，主行重建后把焦点还给它（重建会换掉节点）。
    const ae = document.activeElement;
    const focusP = ae && ae.classList && ae.classList.contains('mlink') && rows.contains(ae) ? ae.dataset.p : null;
    const html = body.providers.length
      ? body.providers.map(p => '<tr data-p="' + esc(p.name) + '">' + [
        cell('', vname(p.name)),
        `<td class="num"><button type="button" class="mlink" data-p="${esc(p.name)}" aria-expanded="false">${p.models} ▾</button></td>`,
        cell('num', p.latency_ms ? p.latency_ms.toFixed(0) : '–'),
        cell('num', p.success_rate > 0 ? (p.success_rate * 100).toFixed(0) + '%' : '–'),
        entCell(p.entitlement),
        cell('', p.last_success_at ? new Date(p.last_success_at).toLocaleString() : '–'),
        cell('', (p.cooldowns || []).map(c => esc((c.scope === 'model' ? t('cd_model').replace('{m}', c.model) : t('cd_plain'))
          .replace('{time}', new Date(c.until).toLocaleTimeString())
          .replace('{reason}', c.reason))).join('<br>') || '–'),
      ].join('') + '</tr>').join('')
      : `<tr><td colspan="7" class="empty">${t('empty')}</td></tr>`;
    // 展开的详情行全程保持连接："摘下来再插回"会让行内的键盘焦点与勾选
    // 现场在每次轮询时丢失。只换主行；详情行按需挪回它的主行后面
    //（现场保留：保存反馈/勾选不丢——用户 2026-10-01 反馈"刷新冲掉输入"同款纪律）。
    const det = rows.querySelector('tr.pdetail');
    const detProvider = det ? det.dataset.p : null;
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    rows.querySelectorAll(':scope > tr:not(.pdetail)').forEach(r => r.remove());
    rows.prepend(tpl.content);
    const mainRow = detProvider ? mainRowOf(detProvider) : null;
    if (det && mainRow && expandedProvider === detProvider) {
      moveAfter(rows, det, mainRow);
      setExpandedState(mainRow, true);
    } else {
      // provider 集变化（行消失）时丢弃旧详情行；展开目标还在就静默重拉。
      if (det) det.remove();
      if (expandedProvider && !dirtyProviders.has(expandedProvider)) loadDetail(expandedProvider, true);
    }
    if (focusP) {
      const row = mainRowOf(focusP);
      if (row) row.querySelector('button.mlink').focus();
    }
    if (window.OFD) OFD.motion.rows(rows);
    document.getElementById('meta').textContent =
      t('meta').replace('{p}', body.providers.length).replace('{m}', body.models_total).replace('{time}', new Date().toLocaleTimeString());
    // 模型目录同步状态（live /models 每小时自动拉一轮；按钮可手动立刻刷）。
    const si = document.getElementById('syncinfo');
    if (body.models_synced_at) {
      si.textContent = t('sync_auto').replace('{time}', new Date(body.models_synced_at).toLocaleString());
    } else {
      si.textContent = t('sync_never');
    }
  } catch (e) {
    setErr(String(e));
  }
}
// 模型数点击展开（事件委托——轮询重建行不丢）。
document.getElementById('rows').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button.mlink');
  if (btn) toggleExpand(btn.dataset.p);
});
load();
// 轮询只在页面可见时进行，回到页面立即补刷；后台刷新请求走低优先级，
// 不与用户触发的请求抢带宽。
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 5000);
// 「刷新模型」：后台同步立即返回，页面 5s 轮询自然带出新目录。
document.getElementById('btnSync').onclick = async function () {
  const btn = this;
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = t('refresh_started');
  try {
    await fetch('api/models/refresh' + (key ? '?key=' + encodeURIComponent(key) : ''), { method: 'POST' });
  } catch (e) { /* 轮询会反映结果 */ }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 3000);
};
</script>
</body>
</html>
