<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">OmniFusion · Compression</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 14px; color: #8b949e; margin: 24px 0 8px; font-weight: 600; }
  nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  nav a[aria-current] { color: #e6edf3; text-decoration: underline; }
  .meta { color: #8b949e; font-size: 12px; }
  /* 表头吸顶：长表滚动时列含义不丢（separate 让表头的边框跟着吸顶走）。 */
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  thead th { position: sticky; inset-block-start: 0; z-index: 1; background: #0d1117; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; width: 80px; height: 8px; background: #21262d; border-radius: 4px; vertical-align: middle; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: #3fb950; }
  .empty { color: #8b949e; padding: 24px 0; }
  #err { color: #f85149; white-space: pre-wrap; }
  /* 视觉隐藏、读屏可见（跳转链接）；聚焦时现身。 */
  .vh:where(:not(:focus, :active)) { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; overflow: hidden !important; clip-path: inset(50%) !important; white-space: nowrap !important; border: 0 !important; }
  .skip:focus { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 6px 12px; background: #1f6feb; color: #fff; border-radius: 6px; text-decoration: none; }
  /* 跳转链接落点：内容区获得焦点时给一圈细线，说明"你在这里"。 */
  main:focus { outline: 2px solid #58a6ff; outline-offset: -2px; }
</style>
<script src="assets/gsap.min.js" defer></script>
<script src="assets/motion.js" defer></script>
</head>
<body>
<a class="vh skip" href="#main" data-i18n="skip_main">Skip to main content</a>
<header>
  <h1 id="pageTitle" data-i18n="page_title">OmniFusion · Compression</h1>
  <nav id="nav" data-i18n-aria="nav_label"></nav>
</header>
<main id="main" tabindex="-1">
<p class="meta" id="meta"></p>
<div id="err" role="status"></div>
<h2 id="h-stage" data-i18n="h_stage_stats">stage stats</h2>
<table aria-labelledby="h-stage">
  <thead><tr>
    <th scope="col" data-i18n="th_stage">stage</th><th class="num" scope="col" data-i18n="th_runs">runs</th><th class="num" scope="col" data-i18n="th_applied">applied</th>
    <th class="num" scope="col" data-i18n="th_skipped">skipped</th><th class="num" scope="col" data-i18n="th_gate">gate ✗</th><th class="num" scope="col" data-i18n="th_errors">errors</th>
    <th class="num" scope="col" data-i18n="th_tokens">tokens in → out</th><th scope="col" data-i18n="th_saved">saved</th>
  </tr></thead>
  <tbody id="stages"></tbody>
</table>
<h2 id="h-combo" data-i18n="h_combo_totals">combo totals</h2>
<table aria-labelledby="h-combo">
  <thead><tr>
    <th scope="col" data-i18n="th_combo">combo</th><th class="num" scope="col" data-i18n="th_runs">runs</th><th class="num" scope="col" data-i18n="th_tokens">tokens in → out</th><th scope="col" data-i18n="th_saved">saved</th>
  </tr></thead>
  <tbody id="combos"></tbody>
</table>
</main>
<script>
'use strict';
// --- i18n (pattern shared across dashboard pages) ---
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('ofd-lang');
  const nav = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const lang = (q === 'zh' || q === 'en') ? q : ((saved === 'zh' || saved === 'en') ? saved : nav);
  try { localStorage.setItem('ofd-lang', lang); } catch (e) {}
  return lang;
})();
const I18N = {
  en: {
    page_title: 'OmniFusion · Compression',
    nav_label: 'Pages', skip_main: 'Skip to main content',
    nav_providers: 'Providers', nav_keys: 'Keys', nav_usage: 'Usage',
    nav_compression: 'Compression', nav_resilience: 'Resilience', nav_chat: 'Chat',
    h_stage_stats: 'stage stats', h_combo_totals: 'combo totals',
    th_stage: 'stage', th_runs: 'runs', th_applied: 'applied', th_skipped: 'skipped',
    th_gate: 'gate ✗', th_errors: 'errors', th_tokens: 'tokens in → out', th_saved: 'saved',
    th_combo: 'combo',
    default_tag: '(default)',
    empty_stages: 'no compression runs yet — send a request with a bound combo',
    empty_combos: 'no combos configured',
    meta: 'default combo: {c} · in-memory counters, reset on restart · refreshed {time}',
  },
  zh: {
    page_title: 'OmniFusion · 压缩',
    nav_label: '页面', skip_main: '跳到主要内容',
    nav_providers: '提供商', nav_keys: '密钥', nav_usage: '用量',
    nav_compression: '压缩', nav_resilience: '弹性', nav_chat: '对话',
    h_stage_stats: '阶段统计', h_combo_totals: '组合总计',
    th_stage: '阶段', th_runs: '执行次数', th_applied: '已应用', th_skipped: '已跳过',
    th_gate: '门控 ✗', th_errors: '错误', th_tokens: 'token 输入 → 输出', th_saved: '节省',
    th_combo: '组合',
    default_tag: '（默认）',
    empty_stages: '暂无压缩执行记录 — 发送一个绑定了组合的请求',
    empty_combos: '未配置任何组合',
    meta: '默认组合：{c} · 计数器保存在内存中，重启后重置 · 刷新于 {time}',
  },
};
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });

const key = new URLSearchParams(location.search).get('key') || '';
const PAGES = [['providers','nav_providers'],['keys','nav_keys'],['usage','nav_usage'],
               ['compression','nav_compression'],['resilience','nav_resilience'],['chat','nav_chat']];
const pageHref = (id, lang) => id + '.html?' + (key ? 'key=' + encodeURIComponent(key) + '&' : '') + 'lang=' + lang;
const EMBED = new URLSearchParams(location.search).has('embed');
try { document.cookie = 'ofdPageLoaded=' + Date.now() + '; path=/; SameSite=Lax'; } catch (e) {} // 桌面端内嵌：壳是唯一语言/导航控制源
{
  const nav = document.getElementById('nav');
  if (EMBED) {
    nav.hidden = true;
    document.querySelector('.skip').hidden = true;
  } else {
    const link = (href, text) => { const a = document.createElement('a'); a.href = href; a.textContent = text; return a; };
    nav.replaceChildren(
      ...PAGES.map(([id, nk]) => {
        const a = link(pageHref(id, LANG), t(nk));
        if (id === 'compression') a.setAttribute('aria-current', 'page');
        return a;
      }),
      link(pageHref('compression', 'zh'), '中文'), link(pageHref('compression', 'en'), 'EN'),
    );
  }
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cell(cls, text) { return `<td${cls ? ` class="${cls}"` : ''}>${text}</td>`; }
function saved(before, after) {
  if (before <= 0) return `<span class="meta">–</span>`;
  const pct = Math.max(0, (before - after) / before);
  return `<span class="bar"><span style="width:${pct * 100}%"></span></span> <span class="meta">${pct.toFixed(0)}%</span>`;
}
function flow(before, after) {
  const f = n => n >= 1000000 ? (n / 1000000).toFixed(1) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
  return `${f(before)} → ${f(after)}`;
}

// 错误区是 live region（role="status"）：同一条错误不重复写入，读屏才不会每 5s 被念一遍。
const err = document.getElementById('err');
const setErr = (msg) => { if (err.textContent !== msg) err.textContent = msg; };

async function load(background = false) {
  try {
    const resp = await fetch('api/compression/stats' + (key ? '?key=' + encodeURIComponent(key) : ''), background ? { priority: 'low' } : {});
    const body = await resp.json();
    setErr(resp.ok ? '' : (body.error && body.error.message) || `HTTP ${resp.status}`);
    if (!resp.ok) return;
    const stages = document.getElementById('stages');
    if (!body.stages.length) {
      stages.innerHTML = `<tr><td colspan="8" class="empty">${t('empty_stages')}</td></tr>`;
    } else {
      stages.innerHTML = body.stages.map(s => {
        const st = s.stats;
        return '<tr>' + [
          cell('', esc(s.stage)),
          cell('num', st.runs),
          cell('num', st.applied),
          cell('num', st.skipped),
          cell('num', st.gate_rejected),
          cell('num', st.errors),
          cell('num', flow(st.tokens_before, st.tokens_after)),
          cell('', saved(st.tokens_before, st.tokens_after)),
        ].join('') + '</tr>';
      }).join('');
    }
    const combos = document.getElementById('combos');
    if (!body.combos.length) {
      combos.innerHTML = `<tr><td colspan="4" class="empty">${t('empty_combos')}</td></tr>`;
    } else {
      combos.innerHTML = body.combos.map(c => {
        const st = c.stats;
        const def = c.combo === body.default_combo ? ' <span class="meta">' + t('default_tag') + '</span>' : '';
        return '<tr>' + [
          cell('', esc(c.combo) + def),
          cell('num', st.runs),
          cell('num', flow(st.tokens_before, st.tokens_after)),
          cell('', saved(st.tokens_before, st.tokens_after)),
        ].join('') + '</tr>';
      }).join('');
    }
    if (window.OFD) { OFD.motion.rows(stages); OFD.motion.rows(combos); }
    document.getElementById('meta').textContent =
      t('meta').replace('{c}', body.default_combo || '–').replace('{time}', new Date().toLocaleTimeString());
  } catch (e) {
    setErr(String(e));
  }
}
load();
// 轮询只在页面可见时进行，回到页面立即补刷；后台刷新请求走低优先级，
// 不与用户触发的请求抢带宽。
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 5000);
</script>
</body>
</html>
