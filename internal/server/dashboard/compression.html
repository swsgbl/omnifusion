<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">OmniFusion · Compression</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 14px; color: #8b949e; margin: 24px 0 8px; font-weight: 600; }
  nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  nav a[aria-current] { color: #e6edf3; text-decoration: underline; }
  .meta { color: #8b949e; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; width: 80px; height: 8px; background: #21262d; border-radius: 4px; vertical-align: middle; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: #3fb950; }
  .empty { color: #8b949e; padding: 24px 0; }
  #err { color: #f85149; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="page_title">OmniFusion · Compression</h1>
  <nav id="nav"></nav>
</header>
<p class="meta" id="meta"></p>
<div id="err"></div>
<h2 data-i18n="h_stage_stats">stage stats</h2>
<table>
  <thead><tr>
    <th data-i18n="th_stage">stage</th><th class="num" data-i18n="th_runs">runs</th><th class="num" data-i18n="th_applied">applied</th>
    <th class="num" data-i18n="th_skipped">skipped</th><th class="num" data-i18n="th_gate">gate ✗</th><th class="num" data-i18n="th_errors">errors</th>
    <th class="num" data-i18n="th_tokens">tokens in → out</th><th data-i18n="th_saved">saved</th>
  </tr></thead>
  <tbody id="stages"></tbody>
</table>
<h2 data-i18n="h_combo_totals">combo totals</h2>
<table>
  <thead><tr>
    <th data-i18n="th_combo">combo</th><th class="num" data-i18n="th_runs">runs</th><th class="num" data-i18n="th_tokens">tokens in → out</th><th data-i18n="th_saved">saved</th>
  </tr></thead>
  <tbody id="combos"></tbody>
</table>
<script>
'use strict';
// --- i18n (pattern shared across dashboard pages) ---
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('ofd-lang');
  const nav = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  const lang = (q === 'zh' || q === 'en') ? q : ((saved === 'zh' || saved === 'en') ? saved : nav);
  try { localStorage.setItem('ofd-lang', lang); } catch (e) {}
  return lang;
})();
const I18N = {
  en: {
    page_title: 'OmniFusion · Compression',
    nav_providers: 'Providers', nav_keys: 'Keys', nav_usage: 'Usage',
    nav_compression: 'Compression', nav_resilience: 'Resilience', nav_chat: 'Chat',
    h_stage_stats: 'stage stats', h_combo_totals: 'combo totals',
    th_stage: 'stage', th_runs: 'runs', th_applied: 'applied', th_skipped: 'skipped',
    th_gate: 'gate ✗', th_errors: 'errors', th_tokens: 'tokens in → out', th_saved: 'saved',
    th_combo: 'combo',
    default_tag: '(default)',
    empty_stages: 'no compression runs yet — send a request with a bound combo',
    empty_combos: 'no combos configured',
    meta: 'default combo: {c} · in-memory counters, reset on restart · refreshed {time}',
  },
  zh: {
    page_title: 'OmniFusion · 压缩',
    nav_providers: '提供商', nav_keys: '密钥', nav_usage: '用量',
    nav_compression: '压缩', nav_resilience: '弹性', nav_chat: '对话',
    h_stage_stats: '阶段统计', h_combo_totals: '组合总计',
    th_stage: '阶段', th_runs: '执行次数', th_applied: '已应用', th_skipped: '已跳过',
    th_gate: '门控 ✗', th_errors: '错误', th_tokens: 'token 输入 → 输出', th_saved: '节省',
    th_combo: '组合',
    default_tag: '（默认）',
    empty_stages: '暂无压缩执行记录 — 发送一个绑定了组合的请求',
    empty_combos: '未配置任何组合',
    meta: '默认组合：{c} · 计数器保存在内存中，重启后重置 · 刷新于 {time}',
  },
};
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

const key = new URLSearchParams(location.search).get('key') || '';
const PAGES = [['providers','nav_providers'],['keys','nav_keys'],['usage','nav_usage'],
               ['compression','nav_compression'],['resilience','nav_resilience'],['chat','nav_chat']];
const pageHref = (id, lang) => id + '.html?' + (key ? 'key=' + encodeURIComponent(key) + '&' : '') + 'lang=' + lang;
document.getElementById('nav').innerHTML = PAGES.map(([id, nk]) => {
  const cur = id === 'compression' ? ' aria-current="page"' : '';
  return `<a href="${pageHref(id, LANG)}"${cur}>${t(nk)}</a>`;
}).join('') +
  ` <a href="${pageHref('compression', 'zh')}">中文</a> <a href="${pageHref('compression', 'en')}">EN</a>`;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cell(cls, text) { return `<td${cls ? ` class="${cls}"` : ''}>${text}</td>`; }
function saved(before, after) {
  if (before <= 0) return `<span class="meta">–</span>`;
  const pct = Math.max(0, (before - after) / before);
  return `<span class="bar"><span style="width:${pct * 100}%"></span></span> <span class="meta">${pct.toFixed(0)}%</span>`;
}
function flow(before, after) {
  const f = n => n >= 1000000 ? (n / 1000000).toFixed(1) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
  return `${f(before)} → ${f(after)}`;
}

async function load() {
  const err = document.getElementById('err');
  try {
    const resp = await fetch('api/compression/stats' + (key ? '?key=' + encodeURIComponent(key) : ''));
    const body = await resp.json();
    err.textContent = resp.ok ? '' : (body.error && body.error.message) || `HTTP ${resp.status}`;
    if (!resp.ok) return;
    const stages = document.getElementById('stages');
    if (!body.stages.length) {
      stages.innerHTML = `<tr><td colspan="8" class="empty">${t('empty_stages')}</td></tr>`;
    } else {
      stages.innerHTML = body.stages.map(s => {
        const st = s.stats;
        return '<tr>' + [
          cell('', esc(s.stage)),
          cell('num', st.runs),
          cell('num', st.applied),
          cell('num', st.skipped),
          cell('num', st.gate_rejected),
          cell('num', st.errors),
          cell('num', flow(st.tokens_before, st.tokens_after)),
          cell('', saved(st.tokens_before, st.tokens_after)),
        ].join('') + '</tr>';
      }).join('');
    }
    const combos = document.getElementById('combos');
    if (!body.combos.length) {
      combos.innerHTML = `<tr><td colspan="4" class="empty">${t('empty_combos')}</td></tr>`;
    } else {
      combos.innerHTML = body.combos.map(c => {
        const st = c.stats;
        const def = c.combo === body.default_combo ? ' <span class="meta">' + t('default_tag') + '</span>' : '';
        return '<tr>' + [
          cell('', esc(c.combo) + def),
          cell('num', st.runs),
          cell('num', flow(st.tokens_before, st.tokens_after)),
          cell('', saved(st.tokens_before, st.tokens_after)),
        ].join('') + '</tr>';
      }).join('');
    }
    document.getElementById('meta').textContent =
      t('meta').replace('{c}', body.default_combo || '–').replace('{time}', new Date().toLocaleTimeString());
  } catch (e) {
    err.textContent = String(e);
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
