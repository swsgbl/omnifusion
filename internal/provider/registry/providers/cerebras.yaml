providers:
  - id: cerebras
    kind: openai_compat
    display_name: Cerebras
    base_url: https://api.cerebras.ai/v1
    auth_style: bearer
    key_env: CEREBRAS_API_KEY
    signup_url: https://cloud.cerebras.ai
    capabilities:
      input: [text]
      output: [text]
      features: [tools]
    free_tier: 免费试用 1M tokens/天、30K TPM、5 RPM（无卡）
    rate_limits: {rpm: 5, tpm: 30000, tpd: 1000000}
    models:
      # 免费试用/开发者额度内 $0（额度耗尽转按量，不登记）。
      - id: gpt-oss-120b
        price_in: 0
        price_out: 0
      - id: zai-glm-4.7
        price_in: 0
        price_out: 0
      - id: gemma-4-31b
        price_in: 0
        price_out: 0
