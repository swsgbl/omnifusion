providers:
  - id: nvidia
    kind: openai_compat
    display_name: NVIDIA NIM
    # 聚合面：同一 key 后多路复用多家上游模型。
    base_url: https://integrate.api.nvidia.com/v1
    auth_style: bearer
    key_env: NVAPI_API_KEY
    capabilities:
      input: [text, image]
      output: [text]
      features: [tools]
    free_tier: 免费开发者额度约 40 RPM（build.nvidia.com，按账户积分）
    rate_limits: {rpm: 40} # 官方口径"约"，保守取 40
    models:
      # 开发者免费积分内 $0（积分耗尽转按量，不登记）。
      # 2026-08-30 经 live /models（83 个）核对：qwen3.5-122b-a10b、
      # meta/llama-3.1-8b-instruct 已下架，勿再声明。
      - id: moonshotai/kimi-k2.6
        price_in: 0
        price_out: 0
      - id: openai/gpt-oss-120b
        price_in: 0
        price_out: 0
      - id: deepseek-ai/deepseek-v4-flash-0731
        price_in: 0
        price_out: 0
      - id: google/gemma-4-31b-it
        price_in: 0
        price_out: 0
