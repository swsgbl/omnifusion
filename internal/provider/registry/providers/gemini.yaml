providers:
  - id: gemini
    kind: gemini
    display_name: Google Gemini
    # 原生 generateContent 协议（/v1beta/models/{model}:generateContent，
    # x-goog-api-key）——M3.2 起由 internal/translate 纯函数对承接互译，
    # 适配器只做 HTTP 壳；此前走 /v1beta/openai 兼容面，现切换到原生协议。
    # 注：本机网络当前无法直连 generativelanguage.googleapis.com，
    # 需按 docs/06 的网络纪律配置分级代理后使用。
    base_url: https://generativelanguage.googleapis.com
    key_env: GEMINI_API_KEY
    capabilities:
      input: [text, image, audio]
      output: [text]
      features: [tools]
    free_tier: AI Studio 免费层（按模型配额）
    models:
      - id: gemini-2.5-flash
        context_window: 1048576
      - id: gemini-2.5-flash-lite
        context_window: 1048576
      - id: gemini-3.1-flash-lite
        context_window: 1048576
