providers:
  - id: gemini
    kind: gemini
    display_name: Google Gemini
    # 原生 generateContent 协议（/v1beta/models/{model}:generateContent，
    # x-goog-api-key）——随后由 internal/translate 纯函数对承接互译，
    # 适配器只做 HTTP 壳；此前走 /v1beta/openai 兼容面，现切换到原生协议。
    # 注：部分网络环境可能无法直连 generativelanguage.googleapis.com，
    # 需配置代理后使用。
    base_url: https://generativelanguage.googleapis.com
    key_env: GEMINI_API_KEY
    signup_url: https://aistudio.google.com/app/apikey
    capabilities:
      input: [text, image, audio]
      output: [text]
      features: [tools]
    free_tier: AI Studio 免费层（按模型配额）
    models:
      # AI Studio 免费层内 $0（超层转按量计费；按免费路径口径登记）。
      - id: gemini-2.5-flash
        context_window: 1048576
        price_in: 0
        price_out: 0
      - id: gemini-2.5-flash-lite
        context_window: 1048576
        price_in: 0
        price_out: 0
      - id: gemini-3.1-flash-lite
        context_window: 1048576
        price_in: 0
        price_out: 0
