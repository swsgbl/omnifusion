providers:
  - id: agnes
    kind: openai_compat
    display_name: Agnes AI
    base_url: https://apihub.agnes-ai.com/v1
    auth_style: bearer
    key_env: AGNES_API_KEY
    signup_url: https://agnes-ai.com
    capabilities:
      input: [text]
      output: [text]
      features: [tools]
    # 2026-11-26 实测：账户余额为负（Pro 系列回 403 "Insufficient user
    # quota"）时 agnes-2.5-flash / agnes-3.0-flash 仍正常出结果——Flash
    # 系列免费、Pro 系列按量计费。
    free_tier: Flash 系列免费（agnes-2.5-flash、agnes-3.0-flash）；Pro 系列按量计费
    models:
      # 2026-11-26 经 live /models（13 个）核对并逐模型探测：此前登记的
      # agnes-2.0-flash（500/429）与 agnes-1.5-flash（404）已不可用。
      # 清单里的 image/video/sys1 模型不走对话端点，不登记。
      - id: agnes-2.5-flash
        price_in: 0
        price_out: 0
      - id: agnes-3.0-flash
        price_in: 0
        price_out: 0
