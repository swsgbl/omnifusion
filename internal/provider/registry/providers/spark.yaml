providers:
  - id: spark
    kind: openai_compat
    display_name: 讯飞星火
    # 星火 OpenAI 兼容端点：Spark Lite 永久免费（2024-05 官宣）；
    # Pro/Max 系按量付费。API Key 在 xinghuo.xfyun.cn 控制台创建。
    # 注意：Lite 不支持 system 消息（Ultra/Max 才支持）——网关透传，
    # 遇上游报错会走故障切换。
    # 2026-08-31 实测：端点可达（401 需 key）。
    base_url: https://spark-api-open.xf-yun.com/v1
    auth_style: bearer
    key_env: SPARK_API_KEY
    signup_url: https://console.xfyun.cn
    capabilities:
      input: [text]
      output: [text]
    free_tier: Spark Lite 永久免费（并发/速率受限）
    models:
      - id: lite
        price_in: 0
        price_out: 0
