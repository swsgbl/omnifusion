# OmniFusion 内置 provider 声明。
# 端点/鉴权/免费层信息核对自上游源码与官方文档（核对日期
# 2026-08-28）与各官方文档。
# 修改后由 internal/provider/registry 经 go:embed 加载。

providers:
  - id: openrouter
    kind: openai_compat
    display_name: OpenRouter
    # 聚合器：数百个上游模型多路复用在同一 key 后（含 :free 后缀免费模型）。
    base_url: https://openrouter.ai/api/v1
    auth_style: bearer
    key_env: OPENROUTER_API_KEY
    # OmniRoute 同款礼仪头：用于上游统计来源。
    extra_headers:
      HTTP-Referer: https://github.com/swsgbl/omnifusion
      X-Title: OmniFusion
    capabilities:
      input: [text, image]
      output: [text]
      features: [tools]
    free_tier: ":free 后缀模型 $0；免费层 20 RPM / 200 RPD（无卡）"
    rate_limits: {rpm: 20, rpd: 200}
    models:
      - id: openrouter/auto
        context_window: 128000
      # 免费模型按需以 "<vendor>/<model>:free" 直接寻址，目录不冻结具体名单。
