providers:
  - id: zhipu
    kind: openai_compat
    display_name: 智谱 BigModel
    # 国内直连（docs.bigmodel.cn「OpenAI API 兼容」）：按量/免费模型共用
    # /api/paas/v4（GLM Coding Plan 专属 /api/coding/paas/v4 是另一端点，
    # 勿混用）。2026-08-30 核对：GLM-4.5-Flash 完全免费——128K 上下文，
    # 具备推理/代码/工具调用能力；GLM-4.7-Flash（30B/3B 激活）同系免费。
    base_url: https://open.bigmodel.cn/api/paas/v4
    auth_style: bearer
    key_env: ZHIPU_API_KEY
    capabilities:
      input: [text]
      output: [text]
      features: [tools]
    # 限速为并发数口径（官方 rate-limit 文档），无固定 RPM/RPD 数值可
    # 登记，不设滑动窗口；超限 429 由隔离层照常接管。
    free_tier: GLM-4.5-Flash / GLM-4.7-Flash 完全免费（并发限速）
    models:
      - id: glm-4.5-flash
        context_window: 131072
        price_in: 0
        price_out: 0
      - id: glm-4.7-flash
        context_window: 131072
        price_in: 0
        price_out: 0
