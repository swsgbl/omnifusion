name: Release

# docs/05 纪律 7：里程碑收官打 annotated tag，goreleaser 出多平台产物。
# 推 v* tag 触发；配置见 .goreleaser.yaml（6 目标：win/linux/darwin × amd64/arm64）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Test before release
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
